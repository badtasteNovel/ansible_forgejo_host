---
# 這支 playbook 完全不透過 vSphere/ESXi API（不裝 pyvmomi、不用 community.vmware），
# 只靠純 SSH + scp + ESXi 自己的本地 CLI 工具（vmkfstools）：
#   1. 產生兩組 SSH 金鑰：client 端（charlie 登入用）跟 VM 自己的 host key
#      （host key 預先產生、透過 ISO 塞進去蓋掉 openssh-server 開機時自動生成的那組，
#      這樣 fingerprint 在裝機前就已經知道，不用等 VM 開機、SSH 起來才去 scan）
#   2. 產生 VM 自己的 WireGuard 金鑰，這台 VM 一定會被設成 WireGuard server
#      （這也是它被叫做 control-panel 的原因）——不是選用功能。另外視 peer_slot_count
#      新增對應數量的「匿名」peer 位置（還沒被任何機器認領，只是先把金鑰/IP 產生好）
#      ——實際由哪台機器拿去用，是 playbook/wsl/add-peer.yml 用 glob 認領的事，
#      這裡完全不管。接著掃描 custom/generated/keys/wireguard-keys/wireguard_peers/
#      底下目前已經存在的每一個 peer（不管是這次新增的還是之前就有的），各自讀出
#      自己的公鑰/PresharedKey/IP，動態組出 wg0.conf 的 [Peer] 區塊
#   3. 渲染 preseed.cfg、重新封裝 ISO（跟之前一樣，remaster-iso.sh 完全沒變邏輯）
#   4. 渲染 .vmx
#   5. SSH 進 hypervisor：建資料夾、scp 傳 ISO、scp 傳 .vmx、用 vmkfstools 建兩顆虛擬磁碟
#      （系統碟 + 資料碟，資料碟 preseed 裝機時會自動格式化、掛載到 vm_data_mount_path）
#
# 到這裡自動化就結束——VM 的「註冊」（register）跟「開機」刻意留給人工在 Host Client
# 網頁介面上做，自動化程式碼完全不碰 ESXi 的管理層（inventory）。
#
# 注意：.vmx 檔案格式、vmkfstools 語法是依 VMware 官方文件的一般知識寫的，
# 沒有真實 ESXi 環境測過，實際跑之前請注意。

- name: '產生 Debian VM 所需的所有檔案，上傳到 hypervisor 的 datastore'
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 沒有 vm_name 的預設值——這是「這次要建的 VM 叫什麼」這種每次 build 的
    # 輸入參數，不是 ISO/OS 等級的靜態設定，所以不放在 manifest.json 裡，
    # 也不在這裡寫死。custom/scripts/tasks/go-task/build-vm.yaml 用
    # custom/scripts/vm-form/debian/main.go（用 huh 寫的互動表單，go run
    # 現場跑）現場問使用者，再用 --extra-vars 傳進來。刻意不放預設值：
    # 之前到處各自寫死 "debian-vm" 字串（這裡、Taskfile、
    # playbook/wsl/add-peer.yml、custom/scripts/tasks/ansible/wireguard_keys/vm_key.yml……），
    # 哪天要加第二台 VM、只改掉其中幾個地方，就會悄悄兜不起來——還真的抓到
    # 好幾處漏改的。
    vm_user: charlie
    vm_cpus: 2
    vm_memory_mb: 2048
    vm_disk_system_gb: 30 # 系統碟：/、swap、/home 用 partman 的 home 配方切，不用動
    vm_disk_data_gb: 10 # 第二顆資料碟：preseed 裝機時格式化成 ext4、掛載到 vm_data_mount_path，拿來存檔案/測試用
    vm_data_mount_path: "/data"
    vm_ssh_port: 52222 # 不用預設 22，躲開公開掃描，也避開跟其他服務（例如之後可能裝的 Kubernetes/Cilium）的 port 衝突

    # Harbor 是不是要裝、裝本機的還是接外部既有的，不再是控制節點 build 時的
    # 決定——build:debian 表單不問這題了，改成 VM 開機後使用者自己手動跑
    # bootstrap-services（見 custom/scripts/bootstrap-services/）互動決定。
    # 這裡因此不再有 install_harbor 這個變數：CA/leaf 憑證/harbor.yml/
    # harbor-install.yml 這些 build 時就能確定的東西全部無條件烘焙進 ISO，
    # 裝不裝、用哪個 Harbor 是開機後才知道的事，不能也不需要在這裡擋。
    # 第三顆磁碟（vm_disk_harbor_gb）同理也無條件建立——thin provisioning
    # 幾乎不佔實際空間，不需要為了「可能用不到」去跟開機後才知道的決定搶
    # 時機做條件判斷。
    vm_disk_harbor_gb: 150 # 第三顆碟，無條件建立：8 個 proxy project × 15GiB quota + postgres/redis/trivy + 邊際
    vm_harbor_mount_path: "/var/lib/harbor" # Harbor 全部持久狀態（registry blob 快取本體/postgres/redis/trivy），FHS 慣例路徑，不用官方預設的 /data（那個名字跟這個專案自己的 vm_data_mount_path 太像，容易搞混）
    harbor_user: harbor # rootless 專屬系統使用者，容器逃逸拿不到主機 root
    harbor_home: /srv/harbor # bundle 目錄（docker-compose.yml、harbor.yml、certs/、common/）
    harbor_version: v2.15.4 # 下次要裝成什麼版本；跟 harbor_cfg_version 的 x.y.0 對應關係見 harbor.yml.j2 自己的註解
    harbor_cfg_version: "2.15.0"
    # 跟 hypervisor_password 同一個做法：直接 lookup('env', ...) 讀，不透過
    # --extra-vars 傳——那樣密碼會整個攤在指令列上，ps aux/讀 /proc/<pid>/cmdline
    # 就看得到，這台機器上任何人都讀得到；build-vm.yaml 跑 ansible-playbook 之前
    # 已經 source custom/.env 把整份 .env 匯出成真正的環境變數了，這裡才讀得到。
    harbor_admin_password: "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') }}" # 只有 bootstrap-services 開機後選了要在本機裝 Harbor 才會真的用到，但 harbor.yml 無條件渲染，所以這兩個密碼現在是每次 build 都要填好的必要值
    harbor_db_password: "{{ lookup('env', 'HARBOR_DB_PASSWORD') }}"
    # meta.json 是這個 repo 的部署設定（見 meta.schema.json），跟 custom/.env 不一樣
    # ——.env 放的是「人決定、不想進版控」的密碼；meta.json 放的是「可以跟著 repo
    # 一起 commit」的設定值（port、image 這種非機密的部署參數）。
    harbor_meta: "{{ lookup('file', playbook_dir + '/../../meta.json') | from_json }}"
    # 這個 port 現在是 Harbor 自己在 127.0.0.1 上講明文 HTTP 的內部埠，不是對外埠
    # ——TLS 統一由 caddy-proxy 集中終止，client 端實際連線用的是 caddy_proxy_https_port
    # + harbor_hostname，不是這個值。欄位名稱沿用 meta.json 的 registry.port，
    # 沒有另外改 schema，只是意義從「Harbor 對外埠」變成「Harbor 內部埠」。
    harbor_internal_http_port: "{{ harbor_meta.registry.port }}"
    # 沒有 harbor_hostname 這個變數——這個值現在是開機後 bootstrap-services
    # 表單問出來的（預設值一個合理建議，使用者可以直接改掉），裝機前不知道、
    # 也不需要知道：harbor.yml/harbor.caddy 這兩個樣板現在都是 runtime 才
    # 渲染（見 harbor-install.yml），TLS 憑證也是 Caddy 自己用 tls internal
    # 現場簽發，不需要在 build 時就先決定好這個值。

    # caddy-proxy 是跟 WireGuard 同等級的強制功能（每台 VM 都裝）：獨立用 podman
    # 跑一個 Caddy，當整台 VM 對外的唯一入口，TLS 在這裡集中終止（tls internal
    # 全自動簽發/續期，不需要我們自己生成/管理任何憑證或私鑰），以後每多一個
    # 服務只是在它後面多加一個 site 設定，不用再開新的 ufw 洞。
    caddy_proxy_user: caddy-proxy # rootless 專屬系統使用者，跟 harbor_user 彼此隔離
    caddy_proxy_home: /srv/caddy
    caddy_proxy_https_port: 443 # 整台 VM 唯一對外開放的埠（單一埠 + hostname 分流，不是一個服務一個埠）——這是給「人/client 端」看的值，從頭到尾沒變過
    caddy_proxy_internal_port: 8443 # Caddy 容器自己實際監聽的埠（>1024），不是 443——rootless 的 caddy-proxy 用 podman -p 發布埠時，實際在主機這邊 bind 的是 podman 自己的 rootlessport 這支 helper，一樣是 unprivileged 身份，bind <1024 的特權埠一樣會被擋。443→8443 的轉換改成在 firewall.sh.j2 用 root 身份的 nat REDIRECT 規則做掉（進到 wg0、目標埠 443 的封包，在 kernel 層直接轉成 8443），不需要放寬 net.ipv4.ip_unprivileged_port_start 這個系統層級設定，安全姿態跟 k3s 的 Traefik 一樣：沒有任何 unprivileged 行程真的去 bind 特權埠。caddy-proxy-install.yml 的 podman -p、firewall.sh.j2 的 ufw allow、harbor-install.yml 渲染 harbor.caddy 用的 site 監聽埠都是這個值，不是 caddy_proxy_https_port

    # 兩套獨立的 WireGuard 身分，不是一套：cluster 是跟 WireGuard 本身同等級
    # 的強制功能，管理面存取（SSH）、以後要接的 k3s cluster 流量都走這條，
    # VM 自己固定是 .1——這是這個專案的慣例（每個 cluster 自己的
    # control-panel 永遠是自己這個 /24 網段的 .1，不同 cluster 的這個網段
    # 互相隔離、不互通，不會衝突，跟 Docker 預設 bridge 永遠是 172.17.0.1
    # 同一個道理）。infrastructure 是另一套完全獨立的 WireGuard 網段，給
    # 「不屬於任何單一 cluster、但多個 cluster 都要共用」的基礎設施用
    # （目前只有 Harbor——一個 Harbor 要給多個 k3s cluster 當 pull-through
    # cache，如果 Harbor 只能透過 cluster 自己的 WireGuard 網段存取，其他
    # cluster 的節點就連不到，這正是這套獨立網段存在的理由）。兩套的 peer
    # 認領方式也不一樣：cluster 沿用既有的「build 時預先生成匿名 peer slot，
    # 事後用 playbook/wsl/add-peer.yml 認領」機制（管理面存取，數量/身分在
    # build 時就該決定好）；infrastructure 沒有對應的 Ansible 自動化，是用
    # /srv/network/infrastructure/ 底下的 shell script 在 VM 上現場產生/
    # 加入 peer（見該目錄下腳本自己的說明）——兩套機制並存，彼此不取代。
    wireguard_cluster_vm_address: "10.105.0.1"
    wireguard_cluster_peer_subnet: "10.105.0.0/24" # charlie 的 authorized_keys 用這個限制 from=，只接受從任一合法 WireGuard peer 連進來
    wireguard_cluster_listen_port: 51820
    wireguard_infrastructure_vm_address: "10.104.0.1"
    wireguard_infrastructure_peer_subnet: "10.104.0.0/24"
    wireguard_infrastructure_listen_port: 51821 # 不能跟 wireguard_cluster_listen_port 共用同一個埠——同一台主機上兩個獨立的 wg interface，各自要有自己的 UDP 監聽埠
    # 這幾個常數（位址/子網/埠）是「infrastructure 這個網段長什麼樣子」的
    # 定義，不是「這台 VM 是不是那個網段的 host」——後者才是真正決定要不要
    # 實際產生 wg-infrastructure 金鑰/conf/systemd unit、caddy-proxy 要不要
    # 多綁一個位址、firewall 要不要多開一組洞的旗標。一個網段只能有一個
    # host（.1），不是每台 control-panel VM 都該無條件產生自己的
    # 10.104.0.1——這是 custom/scripts/vm-form/debian/main.go 現場問出來的
    # 值，透過 --extra-vars 傳進來，這裡給預設值 false 純粹是方便本機直接
    # ansible-playbook 測試（不透過 task build:debian、沒有表單）時不會
    # 噴 undefined 錯誤，真正的值永遠是表單問出來的。
    is_infrastructure_host: false
    lan_subnet: "192.168.0.0/24" # 實體 LAN 網段（ESXi host、控制端本機都在這個網段，見 custom/.env.example 的 HYPERVISOR_HOSTNAME=192.168.1.10）——ufw 拿這個限制 WireGuard 監聽埠本身只接受內網來源的 handshake，不開放給整個網際網路
    peer_slot_count: 0 # 要新增幾個匿名的 cluster peer 位置，由 build:debian 的 gum input 透過 --extra-vars 決定——infrastructure 沒有這種 build 時預先生成的機制，見上面的說明

    keys_dir: "{{ playbook_dir }}/../../custom/generated/keys"
    wireguard_keys_base_dir: "{{ keys_dir }}/wireguard-keys" # custom/generated/keys/ 底下按用途分的子資料夾之一
    wireguard_peers_dir: "{{ wireguard_keys_base_dir }}/wireguard_peers" # 每個 peer 一個子目錄，見 custom/scripts/tasks/ansible/wireguard_keys/generate_one_peer_slot.yml、claim_peer.yml
    ssh_key_path: "{{ keys_dir }}/ssh/{{ vm_user }}_ed25519" # VM 上 charlie 登入用的 client 金鑰
    ssh_host_key_path: "{{ keys_dir }}/known-hosts/{{ vm_name }}/ed_25519" # VM 自己的 host key——放在 known-hosts/ 底下，因為這把金鑰的用途就是 known_hosts 驗證
    hypervisor_known_hosts_path: "{{ keys_dir }}/known-hosts/hypervisor_known_hosts"
    # 沒有 known_hosts_path 這個變數——這支 playbook 只負責產生原始金鑰材料，
    # 不組「可以直接拿來連線用」的 known_hosts 檔案，那是 SSH client 端的設定，
    # 歸 playbook/wsl/add-peer.yml 管（見該檔案開頭說明）。

    generated_dir: "{{ playbook_dir }}/../../custom/generated"
    preseed_output_dir: "{{ generated_dir }}/preseed/{{ vm_name }}" # 存放要塞進 ISO 的所有檔案（preseed.cfg + host key）
    preseed_srv_output_dir: "{{ preseed_output_dir }}/srv" # preseed_output_dir 底下專門放「裝完機最終會進 VM /srv 底下」那些檔案的子目錄，目錄結構直接對齊最終的 /srv 結構（srv/ansible/、srv/harbor/、srv/caddy/...），late_command 才能用一行 cp -r 整個搬過去，不用每個檔案各寫一行 mkdir/cp/chmod
    preseed_bootstrap_output_dir: "{{ preseed_output_dir }}/bootstrap" # 同一個道理，裝完機最終會進 VM ~{{ vm_user }}/bootstrap 底下的那些一次性檔案（bootstrap-sudo/bootstrap-services/services/——防火牆相關的腳本已經搬到 srv/init/，見 preseed_srv_output_dir）
    preseed_home_output_dir: "{{ preseed_output_dir }}/home" # 同一個道理，裝完機最終會進 VM ~{{ vm_user }} 底下、但不是一次性的那些檔案（目前只有 scripts/——task/gum 的補裝腳本、~/scripts/wireguard/ 的 Taskfile），跟 bootstrap/ 不一樣：bootstrap/ 整組是一次性、跑完會自我刪除，這裡的東西是打算長期留著用的，所以不能也不該放進 bootstrap/
    iso_output_dir: "{{ generated_dir }}/iso/{{ vm_name }}"
    preseed_output_iso: "{{ iso_output_dir }}/{{ vm_name }}-preseed.iso"
    vmx_output_path: "{{ iso_output_dir }}/{{ vm_name }}.vmx"
    remaster_iso_script: "{{ playbook_dir }}/../../custom/scripts/remaster-iso/debian.sh" # 獨立宣告成變數，以後要換成別的腳本/工具比較方便改

    datastore_vm_dir: "/vmfs/volumes/{{ hypervisor_datastore }}/{{ vm_name }}"
    datastore_iso_path: "{{ datastore_vm_dir }}/{{ vm_name }}-preseed.iso"
    datastore_vmx_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmx"
    datastore_system_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmdk"
    datastore_data_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}-data.vmdk"
    datastore_harbor_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}-harbor.vmdk"

    # 沒有 caddy_certs_dir 這個變數——build 時不再生成任何 CA/leaf 憑證。
    # Caddy 用 tls internal，第一次處理每個 site 時才自己現場生成本地 CA、
    # 簽發 leaf 憑證，存在它自己掛進去的 /data（見 caddy-proxy-install.yml），
    # 完全是 runtime 的事，跟這支 build-time playbook 無關。

    hypervisor_hostname: "{{ lookup('env', 'HYPERVISOR_HOSTNAME') }}"
    hypervisor_username: "{{ lookup('env', 'HYPERVISOR_USERNAME') }}"
    hypervisor_password: "{{ lookup('env', 'HYPERVISOR_PASSWORD') }}"
    hypervisor_datastore: "{{ lookup('env', 'HYPERVISOR_DATASTORE') }}"
    hypervisor_network: "{{ lookup('env', 'HYPERVISOR_NETWORK') }}"

    ssh_opts: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ hypervisor_known_hosts_path }}

  tasks:
    - name: '確認必要變數都有值'
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | length > 0
          - iso_path is defined
          - hypervisor_hostname | length > 0
          - hypervisor_username | length > 0
          - hypervisor_password | length > 0
          - hypervisor_datastore | length > 0
          - hypervisor_network | length > 0
        fail_msg: >-
          請確認 custom/.env 已填好必要連線資訊，且透過 --extra-vars 傳入
          vm_name（custom/scripts/vm-form/debian 問出來的值）跟 iso_path
          （task select-iso 的輸出路徑）——正常透過 task build:debian 跑就
          不用自己管這兩個，Taskfile 會自動帶

    - name: '確保 custom/generated/keys/、custom/generated/preseed/、custom/generated/iso/ 目錄存在'
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ keys_dir }}"
        - "{{ keys_dir }}/ssh" # ssh_key_path 的上層目錄
        - "{{ keys_dir }}/known-hosts/{{ vm_name }}" # ssh_host_key_path 的上層目錄
        - "{{ preseed_output_dir }}"
        - "{{ iso_output_dir }}"

    - name: '產生 SSH 金鑰對（charlie 登入用，若已存在則不重建）'
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        comment: "{{ vm_user }}@{{ vm_name }}"

    - name: '讀取 client 公鑰內容'
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_public_key_raw

    - name: '產生 VM 自己的 SSH host key（若已存在則不重建）'
      community.crypto.openssh_keypair:
        path: "{{ ssh_host_key_path }}"
        type: ed25519
        comment: "{{ vm_name }}"

    - name: '把 host key 複製進 ISO 注入資料夾（用複製檔案，不把金鑰內容塞進 late_command 字串）'
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ preseed_output_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ ssh_host_key_path }}", dest: ssh_host_key, mode: "0600" }
        - { src: "{{ ssh_host_key_path }}.pub", dest: ssh_host_key.pub, mode: "0644" }

    - name: '確保 VM 自己的 cluster WireGuard 金鑰已經產生（只有 VM 自己的身分，跟 peer 金鑰完全分開）'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../custom/scripts/tasks/ansible/wireguard_keys/vm_key.yml"
      vars:
        wireguard_keys_dir: "{{ wireguard_keys_base_dir }}"
        wireguard_key_name: cluster

    - name: '確保 VM 自己的 infrastructure WireGuard 金鑰已經產生（跟 cluster 那組完全獨立，見上面兩套身分的說明；只有這台 VM 真的是 infrastructure 的 host 才需要，不是每台 VM 都無條件產生）'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../custom/scripts/tasks/ansible/wireguard_keys/vm_key.yml"
      vars:
        wireguard_keys_dir: "{{ wireguard_keys_base_dir }}"
        wireguard_key_name: infrastructure
      when: is_infrastructure_host | bool

    - name: "新增 {{ peer_slot_count }} 個匿名的 cluster WireGuard peer 位置（還沒被任何機器認領，數量由 custom/scripts/tasks/go-task/build-vm.yaml 的 gum input 決定；infrastructure 沒有這種機制，見上面的說明）"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../custom/scripts/tasks/ansible/wireguard_keys/generate_one_peer_slot.yml"
      loop: "{{ range(0, peer_slot_count | int) | list }}"
      loop_control:
        label: "第 {{ item + 1 }} 個"
      when: (peer_slot_count | int) > 0

    - name: '讀取 VM 自己的 cluster WireGuard 私鑰'
      ansible.builtin.slurp:
        src: "{{ wireguard_keys_base_dir }}/{{ vm_name }}_wireguard_cluster"
      register: wireguard_cluster_private_key_raw

    - name: '讀取 VM 自己的 infrastructure WireGuard 私鑰（只有這台 VM 是 host 才存在，見上面產生金鑰那個 task 的 when）'
      ansible.builtin.slurp:
        src: "{{ wireguard_keys_base_dir }}/{{ vm_name }}_wireguard_infrastructure"
      register: wireguard_infrastructure_private_key_raw
      when: is_infrastructure_host | bool

    - name: '列出目前已經存在的 cluster WireGuard peer 目錄（數量不固定，可能是 0 個；infrastructure 沒有對應的目錄，peer 是開機後用 /srv/network/infrastructure/ 的 shell script 現場加的，不是 build 時列出來的）'
      ansible.builtin.find:
        paths: "{{ wireguard_peers_dir }}"
        file_type: directory
      register: wireguard_cluster_peer_dirs

    - name: '讀出每個 cluster peer 的公鑰／PresharedKey／IP，組成清單（給 wg-cluster.conf.j2 的 Peer 迴圈用）'
      ansible.builtin.set_fact:
        wireguard_cluster_peers: "{{ wireguard_cluster_peers | default([]) + [{
          'name': item.path | basename,
          'public_key': lookup('file', item.path + '/public') | trim,
          'preshared_key': lookup('file', item.path + '/psk') | trim,
          'address': lookup('file', item.path + '/address') | trim,
        }] }}"
      loop: "{{ wireguard_cluster_peer_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: '建立 ISO 注入資料夾裡的 wireguard/cluster/ 目錄——wg-cluster.conf／.key 都放這裡，late_command 直接整個目錄 cp -r 到 /etc/wireguard/cluster，不用一個檔案一個檔案搬（跟 bootstrap/、srv/ 整包 copy 進 ISO 是同一個「目錄結構直接對齊最終路徑、late_command 整個 cp -r」慣例，只是這裡是逐步渲染/複製單個檔案進來，所以需要先手動建好目錄，不像 bootstrap/srv 那樣整包 copy 自己就會建好）'
      ansible.builtin.file:
        path: "{{ preseed_output_dir }}/wireguard/cluster"
        state: directory
        mode: "0700"

    - name: '建立 ISO 注入資料夾裡的 wireguard/infrastructure/ 目錄——只有這台 VM 是 infrastructure host 才需要（見上面兩套 WireGuard 身分的說明）'
      ansible.builtin.file:
        path: "{{ preseed_output_dir }}/wireguard/infrastructure"
        state: directory
        mode: "0700"
      when: is_infrastructure_host | bool

    - name: '渲染 VM 的 wg-cluster.conf，放進 ISO 注入資料夾（Peer 區塊數量跟著 wireguard_cluster_peers 走，可能是 0 個）'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/template/wireguard_control_panel/wg-cluster.conf.j2"
        dest: "{{ preseed_output_dir }}/wireguard/cluster/wg-cluster.conf"
        mode: "0600"
      vars:
        wireguard_private_key: "{{ (wireguard_cluster_private_key_raw.content | b64decode).strip() }}"
        wireguard_vm_address: "{{ wireguard_cluster_vm_address }}"
        wireguard_listen_port: "{{ wireguard_cluster_listen_port }}"
        wireguard_peers: "{{ wireguard_cluster_peers | default([]) }}"
        # wireguard_cluster_peers 本來就看得到，不需要在這裡用 set_fact 宣告
        # 成別的名字——理由跟之前 enable_wireguard 那次踩到的坑一樣：task 的
        # vars: 裡用同名又參照自己會造成無窮遞迴 templating，這裡直接接到
        # wg-cluster.conf.j2 自己要用的 wireguard_peers 這個名字即可，一個
        # peer 都沒有時完全不會被 set_fact 設到，是 undefined，不是空字串／
        # false，套 default([]) 接住就好。

    - name: '渲染 VM 的 wg-infrastructure.conf，放進 ISO 注入資料夾（沒有 Peer 迴圈——infrastructure 的 peer 不是 build 時預先產生的，一律是空的 [Interface]-only 設定，裝機後由 /srv/network/infrastructure/ 的 shell script 現場加；只有這台 VM 是 host 才需要這份檔案）'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/template/wireguard_control_panel/wg-infrastructure.conf.j2"
        dest: "{{ preseed_output_dir }}/wireguard/infrastructure/wg-infrastructure.conf"
        mode: "0600"
      vars:
        wireguard_private_key: "{{ (wireguard_infrastructure_private_key_raw.content | b64decode).strip() }}"
        wireguard_vm_address: "{{ wireguard_infrastructure_vm_address }}"
        wireguard_listen_port: "{{ wireguard_infrastructure_listen_port }}"
      when: is_infrastructure_host | bool

    - name: '把 VM 自己的 WireGuard 私鑰原始內容也放進 ISO 注入資料夾（跟 .conf 內嵌的那份是同一個值，見 custom/preseed_iso/srv/network/*/show.sh 自己的說明：這份檔案是給 show.sh/peer 認領腳本直接讀取用的，不是重新生成一份不同的金鑰）——cluster 無條件跑，infrastructure 只有這台 VM 是 host 才有對應的金鑰可以複製'
      ansible.builtin.copy:
        src: "{{ wireguard_keys_base_dir }}/{{ vm_name }}_wireguard_{{ item }}"
        dest: "{{ preseed_output_dir }}/wireguard/{{ item }}/wg-{{ item }}.key"
        mode: "0600"
      loop:
        - cluster
        - infrastructure
      when: item == 'cluster' or (is_infrastructure_host | bool)

    - name: "編譯 bootstrap-sudo（charlie SSH 進去後可以自己選擇要不要手動執行的一次性救援腳本，見 custom/scripts/bootstrap-sudo/main.go 開頭說明；go run 不適用——這支要跑在 VM 上，VM 不會有 Go 工具鏈、也不會有這份原始碼，所以這裡要交叉編譯成靜態執行檔，直接塞進 ISO）——放進 preseed_bootstrap_output_dir，直接對齊最終 ~{{ vm_user }}/bootstrap/ 的結構"
      ansible.builtin.command:
        cmd: go build -o {{ preseed_bootstrap_output_dir }}/bootstrap-sudo .
        chdir: "{{ playbook_dir }}/../../custom/scripts/bootstrap-sudo"
      environment:
        CGO_ENABLED: "0" # 靜態連結，VM 上不用依賴任何動態函式庫
        GOOS: linux
        GOARCH: amd64
      changed_when: true

    - name: '把 custom/preseed_iso/srv/ 整個資料夾放進 ISO 注入資料夾——工作目錄結構直接對齊最終 /srv 的結構，一次性全部搬過去，不用每個檔案各寫一個 task（包含 rootless_podman_user_setup.yml——這是 caddy-proxy-install.yml/harbor-install.yml 在 VM 上都要 include 的共用 task fragment，原始檔跟著這整棵 srv/ 樹放在 custom/preseed_iso/srv/ansible/playbook/ 底下，不是放在 custom/scripts/ 裡：custom/scripts/ 只放工作目錄（控制節點）自己會用到的東西，任何裝機過程會被複製進 VM 的檔案都該放進 custom/preseed_iso/）。裡面幾個 .j2 樣板檔案也會原封不動一起被搬過去，大部分對應的渲染 task 會在同一個目錄下產生渲染好的同名（無 .j2）檔案，渲染完會有一個專門的清理 task 把這些用不到的 .j2 原始樣板刪掉（見下面「清掉 srv/ 底下還留著 .j2 副檔名的原始樣板」）——但 harbor/harbor.yml.j2、caddy/sites.d/harbor.caddy.j2 這兩個故意不在這裡渲染，留著 .j2 原封不動搬進 ISO，等 VM 開機後 harbor-install.yml 執行時才用表單填的 harbor_hostname 現場渲染（見該檔案開頭的說明）。caddy-proxy 本身也不再需要預先建一個 certs/ 目錄——它用 Caddy 的 tls internal，CA/憑證是 runtime 第一次處理 site 時才自己生成，寫進另外掛進去的 /data（見 caddy-proxy-install.yml），不是 build 時就要存在的東西'
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/"
        dest: "{{ preseed_srv_output_dir }}/"
        mode: "0600"

    - name: '渲染 srv/init/firewall.sh（late_command 在 d-i chroot 裡套用 ufw 規則不可靠，實測會悄悄 fail-open，見該樣板開頭說明；這支腳本靠 preseed.cfg.j2 寫的 firewall.service 在 VM 真正開機後自動跑一次，才是能安全呼叫 ufw enable 的地方）——上面那個 copy task 已經把原始 .j2 樣板搬過去了，這裡用同一個來源樣板渲染出同名、無 .j2 的正式檔案蓋掉它；跟 podman-network.sh/finalizer.sh 不一樣，這支需要 lan_subnet/wireguard_cluster_listen_port 這些值，不是純文字，所以單獨多一個 template task，不能只靠上面的整包 copy'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/init/firewall.sh.j2"
        dest: "{{ preseed_srv_output_dir }}/init/firewall.sh"
        mode: "0700"

    - name: '渲染 caddy_proxy_runtime_vars.yml，放進 ISO 注入資料夾（caddy-proxy-install.yml 要用的少數幾個值）——放進 preseed_srv_output_dir/ansible/playbook/，直接對齊最終 /srv/ansible/playbook/ 的結構。caddy-proxy 本身不再需要這裡生成任何 CA/憑證——Caddy 用 tls internal，是 runtime 第一次處理 site 時才自己現場生成本地 CA（見 caddy-proxy-install.yml），跟這支 build-time playbook 完全無關'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/ansible/playbook/caddy_proxy_runtime_vars.yml.j2"
        dest: "{{ preseed_srv_output_dir }}/ansible/playbook/caddy_proxy_runtime_vars.yml"
        mode: "0600"

    - name: '渲染 harbor_runtime_vars.yml，放進 ISO 注入資料夾（VM 上那支 harbor-install.yml playbook 要用的少數幾個值——admin 密碼、port 這種——不用回頭解析 harbor.yml 才拿得到）——放進 preseed_srv_output_dir/ansible/playbook/，直接對齊最終 /srv/ansible/playbook/ 的結構。harbor.yml/harbor.caddy 這兩個樣板故意不在這裡渲染——harbor_hostname 現在是開機後表單填的值，裝機前渲染不到，這兩個 .j2 原始樣板會原封不動跟著上面「整個 srv/ 資料夾」那個 copy task 一起搬進 ISO，等 harbor-install.yml 在 VM 上執行時才真正渲染（見該檔案開頭的說明）'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/ansible/playbook/harbor_runtime_vars.yml.j2"
        dest: "{{ preseed_srv_output_dir }}/ansible/playbook/harbor_runtime_vars.yml"
        mode: "0600"

    - name: '清掉 srv/ 底下還留著 .j2 副檔名的原始樣板（上面「把整個 srv/ 資料夾放進 ISO 注入資料夾」那個 task 連這幾支樣板原始檔也一起搬過來了，這裡已經各自渲染出同名、無 .j2 的正式檔案，原始樣板留著沒用、還可能被誤會成還在生效的設定檔）——harbor/harbor.yml.j2、caddy/sites.d/harbor.caddy.j2 這兩個故意不在這份清單裡：它們要留著 .j2，等 harbor-install.yml 在 VM 上才會真正渲染、也才會自己刪掉原始樣板（見該檔案開頭的說明），這裡提早刪掉的話 harbor-install.yml 會直接找不到樣板可以渲染'
      ansible.builtin.file:
        path: "{{ preseed_srv_output_dir }}/{{ item }}"
        state: absent
      loop:
        - ansible/playbook/caddy_proxy_runtime_vars.yml.j2
        - ansible/playbook/harbor_runtime_vars.yml.j2
        - init/firewall.sh.j2

    - name: "編譯 bootstrap-services（VM 開機後使用者自己手動執行的互動表單，見 custom/scripts/bootstrap-services/main.go 開頭說明；go run 不適用，道理跟 bootstrap-sudo 一樣——這支要跑在 VM 上，VM 不會有 Go 工具鏈）——放進 preseed_bootstrap_output_dir，直接對齊最終 ~{{ vm_user }}/bootstrap/ 的結構"
      ansible.builtin.command:
        cmd: go build -o {{ preseed_bootstrap_output_dir }}/bootstrap-services .
        chdir: "{{ playbook_dir }}/../../custom/scripts/bootstrap-services"
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: amd64
      changed_when: true

    - name: "把 bootstrap-services 表單問完之後真正做事的那組 shell script（apply.sh/harbor.sh/caddy.sh，不是樣板、原封不動複製）整個資料夾放進 ISO 注入資料夾——放進 preseed_bootstrap_output_dir/services/，工作目錄的來源路徑直接對齊最終 ~{{ vm_user }}/bootstrap/services/ 的結構"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/bootstrap/services/"
        dest: "{{ preseed_bootstrap_output_dir }}/services/"
        mode: "0700"

    - name: "複製 dns-apply.sh（跟 services/ 平級，不是 apply.sh 那條鏈的一環——bootstrap-services（Go）問完表單之後、呼叫 apply.sh 之前自己直接呼叫的獨立步驟，見該腳本開頭說明）放進 ISO 注入資料夾，直接對齊最終 ~{{ vm_user }}/bootstrap/dns-apply.sh 的位置"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/bootstrap/dns-apply.sh"
        dest: "{{ preseed_bootstrap_output_dir }}/dns-apply.sh"
        mode: "0700"

    - name: "把 custom/preseed_iso/home/ 整個資料夾放進 ISO 注入資料夾——工作目錄結構直接對齊最終 ~{{ vm_user }} 底下的結構（目前只有 scripts/：task/gum 的補裝腳本、~/scripts/wireguard/ 的 Taskfile），跟 bootstrap/ 不一樣，這裡的東西不是一次性的，裝好之後會長期留著用（見上面 preseed_home_output_dir 的說明）"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/home/"
        dest: "{{ preseed_home_output_dir }}/"
        mode: "0700"

    - name: '渲染 preseed.cfg'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/template/preseed.cfg.j2"
        dest: "{{ preseed_output_dir }}/preseed.cfg"
        mode: "0600"
      vars:
        vm_hostname: "{{ vm_name }}"
        ssh_public_key: "{{ (ssh_public_key_raw.content | b64decode).strip() }}"
        ssh_port: "{{ vm_ssh_port }}"

    - name: '重新封裝 ISO，塞入 preseed.cfg、host key 並改開機參數'
      ansible.builtin.command:
        cmd: >
          {{ remaster_iso_script }}
          {{ iso_path }}
          {{ preseed_output_dir }}
          {{ preseed_output_iso }}
      args:
        creates: "{{ preseed_output_iso }}"

    - name: '渲染 .vmx'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/template/debian.vmx.j2"
        dest: "{{ vmx_output_path }}"
        mode: "0600"

    - name: '確保 hypervisor datastore 上的 VM 資料夾存在'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          mkdir -p {{ datastore_vm_dir }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '把重新封裝好的 ISO 上傳到 datastore'
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ preseed_output_iso }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_iso_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '把 .vmx 上傳到 datastore'
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ vmx_output_path }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_vmx_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立系統碟'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_system_gb }}G -d thin {{ datastore_system_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立資料碟'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_data_gb }}G -d thin {{ datastore_data_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立 Harbor 專屬資料碟（無條件建立，見上面 vm_disk_harbor_gb 的說明）'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_harbor_gb }}G -d thin {{ datastore_harbor_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '印出後續手動步驟需要的資訊'
      ansible.builtin.debug:
        msg:
          - "VM 相關檔案都已經上傳完成，接下來要手動做（這幾步是 ESXi Host Client 專屬操作，換平台要重寫）："
          - "1. 登入 Host Client，瀏覽 datastore 到 {{ datastore_vmx_path }}，Register VM"
          - "2. 手動 Power On"
          - "3. 開機、preseed 無人值守安裝跑完後，自己查一下 VM 的 LAN IP（唯一用途：等一下 task add-peer 要用）"
          - "4. 跑 task add-peer——把目前這台機器加進 WireGuard、接通隧道、順便把 known_hosts 跟 SSH 私鑰準備好（VM 的 LAN IP 就是這時候用）"
          - "5. 接通之後，SSH 連線固定走 WireGuard 位址 {{ wireguard_cluster_vm_address }}，不是 VM 的 LAN IP——連線細節看 task add-peer 跑完印出的提示"

    - name: '印出 bootstrap-services 的後續資訊'
      ansible.builtin.debug:
        msg:
          - "6. VM 開機、SSH 進去之後，跑 sudo ~/bootstrap/bootstrap-services——互動問要不要在本機裝 Harbor（還是接一個已經存在的外部 Harbor），裝好/接上之後才會接著裝 caddy-proxy（caddy-proxy 本身是強制功能，但要等這支程式把 Harbor 這塊決定完才會真的執行安裝，這樣 caddy-proxy 自己要拉的 image 才吃得到 Harbor 的 pull-through cache）。"
          - "   選了在本機裝 Harbor 的話，表單會問要用哪個 hostname（裝好之後走 https://<這個值>:{{ caddy_proxy_https_port }}，只能從 WireGuard 隧道連，admin 密碼就是 custom/.env 的 HARBOR_ADMIN_PASSWORD）——這個值現在是開機後才決定，裝機前不知道，peer 端自己的 hosts 檔案要先加一行指到 {{ wireguard_cluster_vm_address }}，名字填表單當時選的那個。"
