---
# 這支 playbook 完全不透過 vSphere/ESXi API（不裝 pyvmomi、不用 community.vmware），
# 只靠純 SSH + scp + ESXi 自己的本地 CLI 工具（vmkfstools）：
#   1. 產生兩組 SSH 金鑰：client 端（charlie 登入用）跟 VM 自己的 host key
#      （host key 預先產生、透過 ISO 塞進去蓋掉 openssh-server 開機時自動生成的那組，
#      這樣 fingerprint 在裝機前就已經知道，不用等 VM 開機、SSH 起來才去 scan）
#   2. 產生 VM 自己的 WireGuard 金鑰，這台 VM 一定會被設成 WireGuard server
#      （這也是它被叫做 control-panel 的原因）——不是選用功能。另外視 peer_slot_count
#      新增對應數量的「匿名」peer 位置（還沒被任何機器認領，只是先把金鑰/IP 產生好）
#      ——實際由哪台機器拿去用，是 playbook/wsl/add-peer.yml 用 glob 認領的事，
#      這裡完全不管。接著掃描 custom/generated/keys/wireguard-keys/wireguard_peers/
#      底下目前已經存在的每一個 peer（不管是這次新增的還是之前就有的），各自讀出
#      自己的公鑰/PresharedKey/IP，動態組出 wg0.conf 的 [Peer] 區塊
#   3. 渲染 preseed.cfg、重新封裝 ISO（跟之前一樣，remaster-iso.sh 完全沒變邏輯）
#   4. 渲染 .vmx
#   5. SSH 進 hypervisor：建資料夾、scp 傳 ISO、scp 傳 .vmx、用 vmkfstools 建兩顆虛擬磁碟
#      （系統碟 + 資料碟，資料碟 preseed 裝機時會自動格式化、掛載到 vm_data_mount_path）
#
# 到這裡自動化就結束——VM 的「註冊」（register）跟「開機」刻意留給人工在 Host Client
# 網頁介面上做，自動化程式碼完全不碰 ESXi 的管理層（inventory）。
#
# 注意：.vmx 檔案格式、vmkfstools 語法是依 VMware 官方文件的一般知識寫的，
# 沒有真實 ESXi 環境測過，實際跑之前請注意。

- name: '產生 Debian VM 所需的所有檔案，上傳到 hypervisor 的 datastore'
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 沒有 vm_name 的預設值——這是「這次要建的 VM 叫什麼」這種每次 build 的
    # 輸入參數，不是 ISO/OS 等級的靜態設定，所以不放在 manifest.json 裡，
    # 也不在這裡寫死。custom/scripts/tasks/go-task/build-vm.yaml 用
    # custom/scripts/vm-form/debian/main.go（用 huh 寫的互動表單，go run
    # 現場跑）現場問使用者，再用 --extra-vars 傳進來。刻意不放預設值：
    # 之前到處各自寫死 "debian-vm" 字串（這裡、Taskfile、
    # playbook/wsl/add-peer.yml、custom/scripts/tasks/ansible/wireguard_keys/vm_key.yml……），
    # 哪天要加第二台 VM、只改掉其中幾個地方，就會悄悄兜不起來——還真的抓到
    # 好幾處漏改的。
    vm_user: charlie
    vm_cpus: 2
    vm_memory_mb: 2048
    vm_disk_system_gb: 30 # 系統碟：/、swap、/home 用 partman 的 home 配方切，不用動
    vm_disk_data_gb: 10 # 第二顆資料碟：preseed 裝機時格式化成 ext4、掛載到 vm_data_mount_path，拿來存檔案/測試用
    vm_data_mount_path: "/data"
    vm_ssh_port: 52222 # 不用預設 22，躲開公開掃描，也避開跟其他服務（例如之後可能裝的 Kubernetes/Cilium）的 port 衝突

    # Harbor 是不是要裝、裝本機的還是接外部既有的，不再是控制節點 build 時的
    # 決定——build:debian 表單不問這題了，改成 VM 開機後使用者自己手動跑
    # bootstrap-services（見 custom/scripts/bootstrap-services/）互動決定。
    # 這裡因此不再有 install_harbor 這個變數：CA/leaf 憑證/harbor.yml/
    # harbor-install.yml 這些 build 時就能確定的東西全部無條件烘焙進 ISO，
    # 裝不裝、用哪個 Harbor 是開機後才知道的事，不能也不需要在這裡擋。
    # 第三顆磁碟（vm_disk_harbor_gb）同理也無條件建立——thin provisioning
    # 幾乎不佔實際空間，不需要為了「可能用不到」去跟開機後才知道的決定搶
    # 時機做條件判斷。
    vm_disk_harbor_gb: 150 # 第三顆碟，無條件建立：8 個 proxy project × 15GiB quota + postgres/redis/trivy + 邊際
    vm_harbor_mount_path: "/var/lib/harbor" # Harbor 全部持久狀態（registry blob 快取本體/postgres/redis/trivy），FHS 慣例路徑，不用官方預設的 /data（那個名字跟這個專案自己的 vm_data_mount_path 太像，容易搞混）
    harbor_user: harbor # rootless 專屬系統使用者，容器逃逸拿不到主機 root
    harbor_home: /srv/harbor # bundle 目錄（docker-compose.yml、harbor.yml、certs/、common/）
    harbor_version: v2.15.4 # 下次要裝成什麼版本；跟 harbor_cfg_version 的 x.y.0 對應關係見 harbor.yml.j2 自己的註解
    harbor_cfg_version: "2.15.0"
    # 跟 hypervisor_password 同一個做法：直接 lookup('env', ...) 讀，不透過
    # --extra-vars 傳——那樣密碼會整個攤在指令列上，ps aux/讀 /proc/<pid>/cmdline
    # 就看得到，這台機器上任何人都讀得到；build-vm.yaml 跑 ansible-playbook 之前
    # 已經 source custom/.env 把整份 .env 匯出成真正的環境變數了，這裡才讀得到。
    harbor_admin_password: "{{ lookup('env', 'HARBOR_ADMIN_PASSWORD') }}" # 只有 bootstrap-services 開機後選了要在本機裝 Harbor 才會真的用到，但 harbor.yml 無條件渲染，所以這兩個密碼現在是每次 build 都要填好的必要值
    harbor_db_password: "{{ lookup('env', 'HARBOR_DB_PASSWORD') }}"
    # meta.json 是這個 repo 的部署設定（見 meta.schema.json），跟 custom/.env 不一樣
    # ——.env 放的是「人決定、不想進版控」的密碼；meta.json 放的是「可以跟著 repo
    # 一起 commit」的設定值（port、image 這種非機密的部署參數）。
    harbor_meta: "{{ lookup('file', playbook_dir + '/../../meta.json') | from_json }}"
    # 這個 port 現在是 Harbor 自己在 127.0.0.1 上講明文 HTTP 的內部埠，不是對外埠
    # ——TLS 統一由 nginx-proxy 集中終止，client 端實際連線用的是 nginx_proxy_https_port
    # + harbor_hostname，不是這個值。欄位名稱沿用 meta.json 的 registry.port，
    # 沒有另外改 schema，只是意義從「Harbor 對外埠」變成「Harbor 內部埠」。
    harbor_internal_http_port: "{{ harbor_meta.registry.port }}"
    harbor_hostname: "harbor.{{ vm_name }}.internal" # client 端要連 Harbor 時打的名字（nginx-proxy 後面的 vhost）；沒有真正的 DNS，peer 端要自己在 hosts 檔案加一行指到 wireguard_vm_address

    # nginx-proxy 是跟 WireGuard 同等級的強制功能（每台 VM 都裝）：獨立用 podman
    # 跑一個 nginx，當整台 VM 對外的唯一入口，TLS 在這裡集中終止，以後每多一個
    # 服務只是在它後面多加一個 vhost，不用再開新的 ufw 洞。
    nginx_proxy_user: nginx-proxy # rootless 專屬系統使用者，跟 harbor_user 彼此隔離
    nginx_proxy_home: /srv/nginx
    nginx_proxy_https_port: 443 # 整台 VM 唯一對外開放的埠（單一埠 + hostname 分流，不是一個服務一個埠）

    wireguard_vm_address: "10.105.0.1"
    wireguard_peer_subnet: "10.105.0.0/24" # charlie 的 authorized_keys 用這個限制 from=，只接受從任一合法 WireGuard peer 連進來
    wireguard_listen_port: 51820
    lan_subnet: "192.168.0.0/24" # 實體 LAN 網段（ESXi host、控制端本機都在這個網段，見 custom/.env.example 的 HYPERVISOR_HOSTNAME=192.168.1.10）——ufw 拿這個限制 WireGuard 監聽埠本身只接受內網來源的 handshake，不開放給整個網際網路
    peer_slot_count: 0 # 要新增幾個匿名 peer 位置，由 build:debian 的 gum input 透過 --extra-vars 決定

    keys_dir: "{{ playbook_dir }}/../../custom/generated/keys"
    wireguard_keys_base_dir: "{{ keys_dir }}/wireguard-keys" # custom/generated/keys/ 底下按用途分的子資料夾之一
    wireguard_peers_dir: "{{ wireguard_keys_base_dir }}/wireguard_peers" # 每個 peer 一個子目錄，見 custom/scripts/tasks/ansible/wireguard_keys/generate_one_peer_slot.yml、claim_peer.yml
    ssh_key_path: "{{ keys_dir }}/ssh/{{ vm_user }}_ed25519" # VM 上 charlie 登入用的 client 金鑰
    ssh_host_key_path: "{{ keys_dir }}/known-hosts/{{ vm_name }}/ed_25519" # VM 自己的 host key——放在 known-hosts/ 底下，因為這把金鑰的用途就是 known_hosts 驗證
    hypervisor_known_hosts_path: "{{ keys_dir }}/known-hosts/hypervisor_known_hosts"
    # 沒有 known_hosts_path 這個變數——這支 playbook 只負責產生原始金鑰材料，
    # 不組「可以直接拿來連線用」的 known_hosts 檔案，那是 SSH client 端的設定，
    # 歸 playbook/wsl/add-peer.yml 管（見該檔案開頭說明）。

    generated_dir: "{{ playbook_dir }}/../../custom/generated"
    preseed_output_dir: "{{ generated_dir }}/preseed/{{ vm_name }}" # 存放要塞進 ISO 的所有檔案（preseed.cfg + host key）
    preseed_srv_output_dir: "{{ preseed_output_dir }}/srv" # preseed_output_dir 底下專門放「裝完機最終會進 VM /srv 底下」那些檔案的子目錄，目錄結構直接對齊最終的 /srv 結構（srv/ansible/、srv/harbor/、srv/nginx/...），late_command 才能用一行 cp -r 整個搬過去，不用每個檔案各寫一行 mkdir/cp/chmod
    preseed_bootstrap_output_dir: "{{ preseed_output_dir }}/bootstrap" # 同一個道理，裝完機最終會進 VM ~{{ vm_user }}/bootstrap 底下的那些一次性檔案（bootstrap-sudo/bootstrap-services/services/——防火牆相關的腳本已經搬到 srv/init/，見 preseed_srv_output_dir）
    iso_output_dir: "{{ generated_dir }}/iso/{{ vm_name }}"
    preseed_output_iso: "{{ iso_output_dir }}/{{ vm_name }}-preseed.iso"
    vmx_output_path: "{{ iso_output_dir }}/{{ vm_name }}.vmx"
    remaster_iso_script: "{{ playbook_dir }}/../../custom/scripts/remaster-iso/debian.sh" # 獨立宣告成變數，以後要換成別的腳本/工具比較方便改

    datastore_vm_dir: "/vmfs/volumes/{{ hypervisor_datastore }}/{{ vm_name }}"
    datastore_iso_path: "{{ datastore_vm_dir }}/{{ vm_name }}-preseed.iso"
    datastore_vmx_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmx"
    datastore_system_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmdk"
    datastore_data_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}-data.vmdk"
    datastore_harbor_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}-harbor.vmdk"

    # CA/leaf 憑證直接生在 preseed_srv_output_dir/nginx/certs/ 底下——不是另外
    # 放一個獨立的 custom/generated/ca/ 再複製過去：這個專案每次 build 前都是
    # 先手動跑 task clean 整個砍掉 custom/generated/ 重來，CA 材料跟 preseed
    # staging 區的生命週期其實是一樣的（都是「這次 build 全新生出來的東西」），
    # 分開放只是多一層複製的間接性，沒有實際的好處。CA 私鑰（ca.key）跟兩份
    # CSR（ca.csr/harbor.csr）生在這裡之後，packaging 前會被專門的清理 task
    # 刪掉（VM 不需要用到 CA 私鑰簽任何東西，CSR 本身也只是中間產物）；
    # harbor.key 是 Harbor vhost 自己的 leaf 私鑰，nginx-proxy 要用它終止 TLS，
    # 這個會留著進 ISO。
    nginx_certs_dir: "{{ preseed_srv_output_dir }}/nginx/certs"

    hypervisor_hostname: "{{ lookup('env', 'HYPERVISOR_HOSTNAME') }}"
    hypervisor_username: "{{ lookup('env', 'HYPERVISOR_USERNAME') }}"
    hypervisor_password: "{{ lookup('env', 'HYPERVISOR_PASSWORD') }}"
    hypervisor_datastore: "{{ lookup('env', 'HYPERVISOR_DATASTORE') }}"
    hypervisor_network: "{{ lookup('env', 'HYPERVISOR_NETWORK') }}"

    ssh_opts: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ hypervisor_known_hosts_path }}

  tasks:
    - name: '確認必要變數都有值'
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | length > 0
          - iso_path is defined
          - hypervisor_hostname | length > 0
          - hypervisor_username | length > 0
          - hypervisor_password | length > 0
          - hypervisor_datastore | length > 0
          - hypervisor_network | length > 0
        fail_msg: >-
          請確認 custom/.env 已填好必要連線資訊，且透過 --extra-vars 傳入
          vm_name（custom/scripts/vm-form/debian 問出來的值）跟 iso_path
          （task select-iso 的輸出路徑）——正常透過 task build:debian 跑就
          不用自己管這兩個，Taskfile 會自動帶

    - name: '確保 custom/generated/keys/、custom/generated/preseed/、custom/generated/iso/ 目錄存在'
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ keys_dir }}"
        - "{{ keys_dir }}/ssh" # ssh_key_path 的上層目錄
        - "{{ keys_dir }}/known-hosts/{{ vm_name }}" # ssh_host_key_path 的上層目錄
        - "{{ preseed_output_dir }}"
        - "{{ iso_output_dir }}"

    - name: '產生 SSH 金鑰對（charlie 登入用，若已存在則不重建）'
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        comment: "{{ vm_user }}@{{ vm_name }}"

    - name: '讀取 client 公鑰內容'
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_public_key_raw

    - name: '產生 VM 自己的 SSH host key（若已存在則不重建）'
      community.crypto.openssh_keypair:
        path: "{{ ssh_host_key_path }}"
        type: ed25519
        comment: "{{ vm_name }}"

    - name: '把 host key 複製進 ISO 注入資料夾（用複製檔案，不把金鑰內容塞進 late_command 字串）'
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ preseed_output_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ ssh_host_key_path }}", dest: ssh_host_key, mode: "0600" }
        - { src: "{{ ssh_host_key_path }}.pub", dest: ssh_host_key.pub, mode: "0644" }

    - name: '確保 VM 自己的 WireGuard 金鑰已經產生（只有 VM 自己的身分，跟 peer 金鑰完全分開）'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../custom/scripts/tasks/ansible/wireguard_keys/vm_key.yml"
      vars:
        wireguard_keys_dir: "{{ wireguard_keys_base_dir }}"

    - name: "新增 {{ peer_slot_count }} 個匿名的 WireGuard peer 位置（還沒被任何機器認領，數量由 custom/scripts/tasks/go-task/build-vm.yaml 的 gum input 決定）"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../custom/scripts/tasks/ansible/wireguard_keys/generate_one_peer_slot.yml"
      loop: "{{ range(0, peer_slot_count | int) | list }}"
      loop_control:
        label: "第 {{ item + 1 }} 個"
      when: (peer_slot_count | int) > 0

    - name: '讀取 VM 自己的 WireGuard 私鑰'
      ansible.builtin.slurp:
        src: "{{ wireguard_keys_base_dir }}/{{ vm_name }}_wireguard"
      register: wireguard_vm_private_key_raw

    - name: '列出目前已經存在的 WireGuard peer 目錄（數量不固定，可能是 0 個）'
      ansible.builtin.find:
        paths: "{{ wireguard_peers_dir }}"
        file_type: directory
      register: wireguard_peer_dirs

    - name: '讀出每個 peer 的公鑰／PresharedKey／IP，組成清單（給 wg0.conf.j2 的 Peer 迴圈用）'
      ansible.builtin.set_fact:
        wireguard_peers: "{{ wireguard_peers | default([]) + [{
          'name': item.path | basename,
          'public_key': lookup('file', item.path + '/public') | trim,
          'preshared_key': lookup('file', item.path + '/psk') | trim,
          'address': lookup('file', item.path + '/address') | trim,
        }] }}"
      loop: "{{ wireguard_peer_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: '渲染 VM 的 wg0.conf，放進 ISO 注入資料夾（Peer 區塊數量跟著 wireguard_peers 走，可能是 0 個）'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/template/wireguard_control_panel/wg0.conf.j2"
        dest: "{{ preseed_output_dir }}/wg0.conf"
        mode: "0600"
      vars:
        wireguard_private_key: "{{ (wireguard_vm_private_key_raw.content | b64decode).strip() }}"
        # wireguard_peers 不在這裡重新宣告——理由跟之前 enable_wireguard 那次
        # 踩到的坑一樣：task 的 vars: 裡用同名又參照自己會造成無窮遞迴
        # templating。wireguard_peers 這個 fact 本來就看得到（一個 peer 都
        # 沒有時完全不會被 set_fact 設到，是 undefined，不是空字串／false，
        # 所以 wg0.conf.j2 裡用 `wireguard_peers | default([])` 接住就好）。

    - name: "編譯 bootstrap-sudo（charlie SSH 進去後可以自己選擇要不要手動執行的一次性救援腳本，見 custom/scripts/bootstrap-sudo/main.go 開頭說明；go run 不適用——這支要跑在 VM 上，VM 不會有 Go 工具鏈、也不會有這份原始碼，所以這裡要交叉編譯成靜態執行檔，直接塞進 ISO）——放進 preseed_bootstrap_output_dir，直接對齊最終 ~{{ vm_user }}/bootstrap/ 的結構"
      ansible.builtin.command:
        cmd: go build -o {{ preseed_bootstrap_output_dir }}/bootstrap-sudo .
        chdir: "{{ playbook_dir }}/../../custom/scripts/bootstrap-sudo"
      environment:
        CGO_ENABLED: "0" # 靜態連結，VM 上不用依賴任何動態函式庫
        GOOS: linux
        GOARCH: amd64
      changed_when: true

    - name: '把 custom/preseed_iso/srv/ 整個資料夾放進 ISO 注入資料夾——工作目錄結構直接對齊最終 /srv 的結構，一次性全部搬過去，不用每個檔案各寫一個 task（包含 rootless_podman_user_setup.yml——這是 nginx-proxy-install.yml/harbor-install.yml 在 VM 上都要 include 的共用 task fragment，原始檔跟著這整棵 srv/ 樹放在 custom/preseed_iso/srv/ansible/playbook/ 底下，不是放在 custom/scripts/ 裡：custom/scripts/ 只放工作目錄（控制節點）自己會用到的東西，任何裝機過程會被複製進 VM 的檔案都該放進 custom/preseed_iso/）。裡面幾個 .j2 樣板檔案也會原封不動一起被搬過去，之後對應的渲染 task 會在同一個目錄下產生渲染好的同名（無 .j2）檔案，渲染完會有一個專門的清理 task 把這些用不到的 .j2 原始樣板刪掉（見下面「清掉 srv/ 底下還留著 .j2 副檔名的原始樣板」）。srv/nginx/certs/ 底下放了一個 .gitignore（憑證是裝機前才簽出來的執行期產物，不會有真正的靜態來源檔案，這份 .gitignore 本身也特意擋掉這個資料夾被意外塞進真正的憑證/私鑰），純粹是為了讓這個遞迴複製能順便建出這一層目錄，不用再額外開一個 task 專門 mkdir'
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/"
        dest: "{{ preseed_srv_output_dir }}/"
        mode: "0600"

    - name: '渲染 srv/init/firewall.sh（late_command 在 d-i chroot 裡套用 ufw 規則不可靠，實測會悄悄 fail-open，見該樣板開頭說明；這支腳本靠 preseed.cfg.j2 寫的 firewall.service 在 VM 真正開機後自動跑一次，才是能安全呼叫 ufw enable 的地方）——上面那個 copy task 已經把原始 .j2 樣板搬過去了，這裡用同一個來源樣板渲染出同名、無 .j2 的正式檔案蓋掉它；跟 podman-network.sh/finalizer.sh 不一樣，這支需要 lan_subnet/wireguard_listen_port 這些值，不是純文字，所以單獨多一個 template task，不能只靠上面的整包 copy'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/init/firewall.sh.j2"
        dest: "{{ preseed_srv_output_dir }}/init/firewall.sh"
        mode: "0700"

    - name: "nginx-proxy 是強制功能：CA 產生、設定檔渲染、安裝 playbook 複製進 ISO 注入資料夾"
      block:
        - name: '產生 nginx-proxy 本地 CA 私鑰（直接生在 nginx_certs_dir 底下，若已存在則不重建）'
          community.crypto.openssl_privatekey:
            path: "{{ nginx_certs_dir }}/ca.key"
            type: RSA
            size: 4096
            mode: "0600"

        - name: '產生 nginx-proxy CA 的 CSR（CA:TRUE，自簽用；CSR 只是中間產物，packaging 前會被清掉，不會留在 ISO 裡）'
          community.crypto.openssl_csr:
            path: "{{ nginx_certs_dir }}/ca.csr"
            privatekey_path: "{{ nginx_certs_dir }}/ca.key"
            common_name: "{{ vm_name }} nginx-proxy Local CA"
            organization_name: "{{ vm_name }}"
            basic_constraints:
              - "CA:TRUE"
            basic_constraints_critical: true
            key_usage:
              - keyCertSign
              - cRLSign
            key_usage_critical: true

        - name: '自簽 nginx-proxy CA 憑證（10 年，若已存在則不重建）'
          community.crypto.x509_certificate:
            path: "{{ nginx_certs_dir }}/ca.crt"
            privatekey_path: "{{ nginx_certs_dir }}/ca.key"
            csr_path: "{{ nginx_certs_dir }}/ca.csr"
            provider: selfsigned
            selfsigned_not_after: "+3650d"
            mode: "0644"

        - name: '渲染 nginx_proxy_runtime_vars.yml，放進 ISO 注入資料夾（nginx-proxy-install.yml 要用的少數幾個值）——放進 preseed_srv_output_dir/ansible/playbook/，直接對齊最終 /srv/ansible/playbook/ 的結構'
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/ansible/playbook/nginx_proxy_runtime_vars.yml.j2"
            dest: "{{ preseed_srv_output_dir }}/ansible/playbook/nginx_proxy_runtime_vars.yml"
            mode: "0600"

    - name: "Harbor 相關檔案一律無條件烘焙進 ISO：leaf 憑證/vhost conf/設定檔產生、渲染、安裝 playbook 複製進 ISO 注入資料夾（裝不裝是 bootstrap-services 開機後才決定的事，不是這裡）"
      block:
        - name: '產生 Harbor leaf 私鑰（直接生在 nginx_certs_dir 底下——這兩個檔案最終會進 /srv/nginx/certs/，不是 /srv/harbor/，Harbor 自己不碰 TLS；若已存在則不重建）'
          community.crypto.openssl_privatekey:
            path: "{{ nginx_certs_dir }}/harbor.key"
            type: RSA
            size: 4096
            mode: "0640"

        - name: '產生 Harbor leaf 憑證的 CSR（CN/SAN 是 harbor_hostname，不是 IP——nginx-proxy 用 hostname 分流，TLS 驗證看的是這個名字，不是 Harbor 自己的位址；CSR 只是中間產物，packaging 前會被清掉）'
          community.crypto.openssl_csr:
            path: "{{ nginx_certs_dir }}/harbor.csr"
            privatekey_path: "{{ nginx_certs_dir }}/harbor.key"
            common_name: "{{ harbor_hostname }}"
            organization_name: "{{ vm_name }}"
            subject_alt_name:
              - "DNS:{{ harbor_hostname }}"
            key_usage:
              - digitalSignature
              - keyEncipherment
            key_usage_critical: true
            extended_key_usage:
              - serverAuth

        - name: '用 nginx-proxy CA 簽發 Harbor leaf 憑證（825 天，每次重跑都重簽——跟 lg-laravel 那套的慣例一致：換 leaf 不換 CA）'
          community.crypto.x509_certificate:
            path: "{{ nginx_certs_dir }}/harbor.crt"
            csr_path: "{{ nginx_certs_dir }}/harbor.csr"
            provider: ownca
            ownca_path: "{{ nginx_certs_dir }}/ca.crt"
            ownca_privatekey_path: "{{ nginx_certs_dir }}/ca.key"
            ownca_not_after: "+825d"
            mode: "0644"

        - name: '渲染 harbor.conf（nginx-proxy 後面 Harbor 的 vhost 設定），放進 ISO 注入資料夾——放進 preseed_srv_output_dir/nginx/conf.d/，直接對齊最終 /srv/nginx/conf.d/ 的結構'
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/nginx/conf.d/harbor.conf.j2"
            dest: "{{ preseed_srv_output_dir }}/nginx/conf.d/harbor.conf"
            mode: "0644"

        - name: '渲染 harbor.yml，放進 ISO 注入資料夾（跟 wg0.conf/preseed.cfg 同一套做法——密碼/位址這些值裝機前在控制節點就全部知道，不用等 VM 開機後才現場組設定檔）——放進 preseed_srv_output_dir/harbor/，直接對齊最終 /srv/harbor/ 的結構'
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/harbor/harbor.yml.j2"
            dest: "{{ preseed_srv_output_dir }}/harbor/harbor.yml"
            mode: "0640"

        - name: '渲染 harbor_runtime_vars.yml，放進 ISO 注入資料夾（VM 上那支 harbor-install.yml playbook 要用的少數幾個值——admin 密碼、port 這種——不用回頭解析 harbor.yml 才拿得到）——放進 preseed_srv_output_dir/ansible/playbook/，直接對齊最終 /srv/ansible/playbook/ 的結構'
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../custom/preseed_iso/srv/ansible/playbook/harbor_runtime_vars.yml.j2"
            dest: "{{ preseed_srv_output_dir }}/ansible/playbook/harbor_runtime_vars.yml"
            mode: "0600"

    - name: '找出 nginx/certs/ 裡面不是正式憑證/私鑰的東西（CA 自己的私鑰、兩份 CSR 中間產物、拿來佔位建目錄用的 .gitignore）——範圍只限定在這個資料夾，不是整個 srv/ 都搜'
      ansible.builtin.find:
        paths: "{{ preseed_srv_output_dir }}/nginx/certs"
        excludes:
          - ca.crt
          - harbor.crt
          - harbor.key
        hidden: true
      register: nginx_certs_cruft_files

    - name: '清掉上面找到的這些檔案'
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nginx_certs_cruft_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: '清掉 srv/ 底下還留著 .j2 副檔名的原始樣板（上面「把整個 srv/ 資料夾放進 ISO 注入資料夾」那個 task 連這幾支樣板原始檔也一起搬過來了，這裡已經各自渲染出同名、無 .j2 的正式檔案，原始樣板留著沒用、還可能被誤會成真正在用的設定檔）'
      ansible.builtin.file:
        path: "{{ preseed_srv_output_dir }}/{{ item }}"
        state: absent
      loop:
        - ansible/playbook/nginx_proxy_runtime_vars.yml.j2
        - nginx/conf.d/harbor.conf.j2
        - harbor/harbor.yml.j2
        - ansible/playbook/harbor_runtime_vars.yml.j2
        - init/firewall.sh.j2

    - name: "編譯 bootstrap-services（VM 開機後使用者自己手動執行的互動表單，見 custom/scripts/bootstrap-services/main.go 開頭說明；go run 不適用，道理跟 bootstrap-sudo 一樣——這支要跑在 VM 上，VM 不會有 Go 工具鏈）——放進 preseed_bootstrap_output_dir，直接對齊最終 ~{{ vm_user }}/bootstrap/ 的結構"
      ansible.builtin.command:
        cmd: go build -o {{ preseed_bootstrap_output_dir }}/bootstrap-services .
        chdir: "{{ playbook_dir }}/../../custom/scripts/bootstrap-services"
      environment:
        CGO_ENABLED: "0"
        GOOS: linux
        GOARCH: amd64
      changed_when: true

    - name: "把 bootstrap-services 表單問完之後真正做事的那組 shell script（apply.sh/harbor.sh/nginx.sh，不是樣板、原封不動複製）整個資料夾放進 ISO 注入資料夾——放進 preseed_bootstrap_output_dir/services/，工作目錄的來源路徑直接對齊最終 ~{{ vm_user }}/bootstrap/services/ 的結構"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/bootstrap/services/"
        dest: "{{ preseed_bootstrap_output_dir }}/services/"
        mode: "0700"

    - name: '渲染 preseed.cfg'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/template/preseed.cfg.j2"
        dest: "{{ preseed_output_dir }}/preseed.cfg"
        mode: "0600"
      vars:
        vm_hostname: "{{ vm_name }}"
        ssh_public_key: "{{ (ssh_public_key_raw.content | b64decode).strip() }}"
        ssh_port: "{{ vm_ssh_port }}"

    - name: '重新封裝 ISO，塞入 preseed.cfg、host key 並改開機參數'
      ansible.builtin.command:
        cmd: >
          {{ remaster_iso_script }}
          {{ iso_path }}
          {{ preseed_output_dir }}
          {{ preseed_output_iso }}
      args:
        creates: "{{ preseed_output_iso }}"

    - name: '渲染 .vmx'
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../custom/preseed_iso/template/debian.vmx.j2"
        dest: "{{ vmx_output_path }}"
        mode: "0600"

    - name: '確保 hypervisor datastore 上的 VM 資料夾存在'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          mkdir -p {{ datastore_vm_dir }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '把重新封裝好的 ISO 上傳到 datastore'
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ preseed_output_iso }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_iso_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '把 .vmx 上傳到 datastore'
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ vmx_output_path }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_vmx_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立系統碟'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_system_gb }}G -d thin {{ datastore_system_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立資料碟'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_data_gb }}G -d thin {{ datastore_data_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '用 vmkfstools 建立 Harbor 專屬資料碟（無條件建立，見上面 vm_disk_harbor_gb 的說明）'
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_harbor_gb }}G -d thin {{ datastore_harbor_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: '印出後續手動步驟需要的資訊'
      ansible.builtin.debug:
        msg:
          - "VM 相關檔案都已經上傳完成，接下來要手動做（這幾步是 ESXi Host Client 專屬操作，換平台要重寫）："
          - "1. 登入 Host Client，瀏覽 datastore 到 {{ datastore_vmx_path }}，Register VM"
          - "2. 手動 Power On"
          - "3. 開機、preseed 無人值守安裝跑完後，自己查一下 VM 的 LAN IP（唯一用途：等一下 task add-peer 要用）"
          - "4. 跑 task add-peer——把目前這台機器加進 WireGuard、接通隧道、順便把 known_hosts 跟 SSH 私鑰準備好（VM 的 LAN IP 就是這時候用）"
          - "5. 接通之後，SSH 連線固定走 WireGuard 位址 {{ wireguard_vm_address }}，不是 VM 的 LAN IP——連線細節看 task add-peer 跑完印出的提示"

    - name: '印出 bootstrap-services 的後續資訊'
      ansible.builtin.debug:
        msg:
          - "6. VM 開機、SSH 進去之後，跑 sudo ~/bootstrap/bootstrap-services——互動問要不要在本機裝 Harbor（還是接一個已經存在的外部 Harbor），裝好/接上之後才會接著裝 nginx-proxy（nginx-proxy 本身是強制功能，但要等這支程式把 Harbor 這塊決定完才會真的執行安裝，這樣 nginx-proxy 自己要拉的 image 才吃得到 Harbor 的 pull-through cache）。"
          - "   選了在本機裝 Harbor 的話，裝好之後走 https://{{ harbor_hostname }}:{{ nginx_proxy_https_port }}（只能從 WireGuard 隧道連），admin 密碼就是 custom/.env 的 HARBOR_ADMIN_PASSWORD；peer 端自己的 hosts 檔案要先加一行：{{ wireguard_vm_address }} {{ harbor_hostname }}。"
