# ansible-navigator 的設定檔——bootstrap-services（Go 程式）呼叫
# `ansible-navigator run --ee-vars-file ... harbor-install.yml`（或
# caddy-proxy-install.yml）時，ansible-navigator 會自動找這個檔案（跟被執行的
# playbook 放同一層，或用 ANSIBLE_NAVIGATOR_CONFIG 指到這裡）。
#
# mode: stdout（不是預設的 interactive TUI）——這支會被 bootstrap-services
# 這個互動程式用子行程方式呼叫，輸出要直接灌進同一個終端機，不需要、也不能
# 跳出 ansible-navigator 自己的全螢幕介面。
#
# execution-environment 的 volume-mounts 把 VM 主機的 /etc、/run、/var/lib、
# /var/cache、/usr/local/share/ca-certificates 原封不動掛進容器同一個
# 路徑——這兩支 playbook 要做 useradd、寫 systemd unit、改 /etc/subuid、
# 操作 rootless podman 的儲存層，這些都是會動到 VM 主機真實狀態的操作，
# 不是容器自己關起門來的事。--privileged --pid=host 讓容器裡的 systemctl
# 真的能透過掛進來的 /run/systemd socket 跟 VM 主機的 systemd 講話。
# 這塊設定沒有實機驗證過，見 config.sh 的 ensure_ee_image() 開頭的說明
# （EE image 現在是手寫 Containerfile、直接用 debian:13-slim 當 base，
# 不是透過 ansible-builder 產生）。
#
# 整個 /etc 掛進來這件事，之前 base image 還是 quay.io/ansible/
# creator-ee（Fedora 系）的時候，蓋掉了容器自己原生的 /etc/pam.d，造成
# sudo 的 PAM account 階段永遠拒絕（詳見 config.sh 的 ensure_ee_image()
# 的說明）——改成 debian:13-slim 之後，宿主機跟容器是同一個發行版，這個
# 問題在根源上消失，不需要額外處理。
#
# --user=0：明確指定這個容器用 root（UID 0）身份跑，不要讓它吃 image 自己
# 的預設使用者（我們自己的 Containerfile 沒有寫 USER，預設就是 root，但
# 明確寫出來比依賴這個隱性預設更保險——以後如果 Containerfile 加了 USER
# 指令，這裡不會悄悄跟著變。--privileged 本身已經給這個容器完整的 Linux
# capabilities，不需要真的是 UID 0 也能做 useradd 之類的操作，但
# become/sudo 這種會查「呼叫者是誰」的場景需要名義上的 UID 真的是 0，
# sudo 對 root 才有跳過密碼驗證的內建邏輯）。
#
# 故意不掛 /opt：這兩支 playbook 完全沒有任何地方碰 /opt（這個專案本來就
# 刻意不用 /opt 放自己的東西，一律改放 /srv/<name>，見 CLAUDE.md）。
#
# /home 不能整個掛：ansible-runner 自己有一道安全檢查，擋掉 "/"、"/home"、
# "/usr" 這三個完整路徑的掛載（實機撞過
# ansible_runner.exceptions.ConfigurationError: cannot mount '/' or '/home'
# or '/usr'）。這兩支 playbook 真正需要寫進 /home 底下的只有 harbor_user/
# caddy_proxy_user 這兩個 rootless 系統使用者各自的 home（寫
# ~/.config/systemd/user/*.service），兩個使用者名稱都是 control-panel/
# debian.yml 寫死的常數（harbor / caddy-proxy，不是裝機時可改的輸入值），
# 所以直接掛這兩條具體路徑，不用掛整個 /home。
ansible-navigator:
  mode: stdout
  execution-environment:
    enabled: true
    image: localhost/vm-ansible-ee:latest
    container-engine: podman
    pull:
      policy: missing
    container-options:
      - "--privileged"
      - "--pid=host"
      - "--network=host"
      - "--user=0"
      # /run 故意不走下面 volume-mounts 那個結構化欄位，改用這裡的原生
      # podman -v 參數直接傳 rslave propagation——ansible-navigator 自己對
      # volume-mounts.options 的值做白名單檢查，只接受 ro/rw/Z/z/O，傳
      # rslave 會直接被設定檔驗證擋下來（"Unrecognized option: 'rslave'"），
      # 不會真的傳到 podman 那層，container-options 是直接原封不動轉給
      # podman 當 CLI 參數，沒有這層額外驗證。
      #
      # 加 rslave 的原因：ansible-navigator 整個 playbook 執行期間只開一個
      # 長駐的 EE 容器，容器啟動當下 harbor/caddy-proxy 的帳號可能還不存在，
      # /run/user/<uid> 這個 tmpfs（systemd-logind 收到 loginctl
      # enable-linger 後才會掛，見 rootless_podman_user_setup.yml）當然也
      # 還不存在。podman 預設的 bind mount propagation 是 private，容器
      # 啟動「之後」主機才新掛上去的子掛載點不會同步反映進這個已經在跑的
      # 容器——實機撞過 become_user: harbor 第一次呼叫 podman（不管是
      # podman info 還是 podman ps）固定噴 "mkdir /run/user/<uid>/libpod:
      # permission denied"，但用一個全新的容器重試就會馬上成功（新容器啟動
      # 時 /run/user/<uid> 已經存在，初始快照就是對的），證明問題出在
      # propagation，不是權限本身。/run 本身在主機上已經是 shared
      # propagation（findmnt 可以確認），rslave 讓容器端變成這個 shared
      # peer group 的 slave，之後主機新掛的東西會自動同步進來，但容器內部
      # 自己建立的掛載不會反向傳回主機（比完全雙向的 shared 更安全、足夠
      # 這裡的需求）。
      - "-v"
      - "/run:/run:rw,rslave"
    volume-mounts:
      - src: /etc
        dest: /etc
        options: rw
      - src: /home/harbor
        dest: /home/harbor
        options: rw
      - src: /home/caddy-proxy
        dest: /home/caddy-proxy
        options: rw
      - src: /home/rustfs
        dest: /home/rustfs
        options: rw
      # harbor_home（/srv/harbor）、caddy_proxy_home（/srv/caddy）、
      # rustfs_home（/srv/rustfs）都在這裡底下——late_command 裝機當下已經
      # 把 harbor.yml/憑證/vhost conf/RustFS 的 NAS 備份腳本這些東西直接
      # 放進最終位置了（見 control-panel/debian.yml），harbor-install.yml/
      # caddy-proxy-install.yml/rustfs-install.yml 要讀寫這些檔案。整個
      # /srv 掛進來，不是隻掛 /srv/harbor、/srv/caddy、/srv/rustfs 三條
      # ——/srv/ansible（這份 playbook 自己的位置）本來就靠 ansible-navigator
      # 自動掛 playbook 所在目錄才摸得到，跟這裡的 volume-mounts 設定無關，
      # 但 /srv/harbor、/srv/caddy、/srv/rustfs 是跟 playbook 不同層的獨立
      # 子目錄，不會被那個自動行為一起帶到，必須自己明確掛——實機撞過
      # harbor-install.yml 收緊 harbor.yml 權限那個 task 直接噴
      # "file (/srv/harbor/harbor.yml) is absent, cannot continue"，但同一
      # 個檔案在主機本身是存在的，純粹因為容器完全沒掛 /srv 這個目錄，
      # 根本看不到。
      - src: /srv
        dest: /srv
        options: rw
      - src: /var/lib
        dest: /var/lib
        options: rw
      - src: /var/cache
        dest: /var/cache
        options: rw
      - src: /usr/local/share/ca-certificates
        dest: /usr/local/share/ca-certificates
        options: rw
  playbook-artifact:
    enable: false # 不需要留執行紀錄檔案，journalctl/bootstrap-services 自己的輸出就夠用
  logging:
    level: warning
