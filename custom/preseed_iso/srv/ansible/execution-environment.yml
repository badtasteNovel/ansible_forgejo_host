# VM 上用 ansible-navigator 執行 harbor-install.yml / nginx-proxy-install.yml
# 用的 Execution Environment 定義——這兩支 playbook 現在不再用裸的
# ansible-playbook 直接跑，改成跑在這個容器化的 Ansible 執行環境裡（見
# ansible-navigator.yml 的設定），目的是集中管理這台 VM 上所有跟 podman
# 相關的套件/image：裝了什麼 Ansible 相關工具、跑這些 playbook 會用到哪些
# container image，都在這一份檔案裡找得到，不用去每個 *-install.yml 裡面翻。
#
# base_image 選 quay.io/ansible/creator-ee——官方現成的 Execution Environment
# 映像，已經包好 ansible-core（不需要額外裝 python 套件），這支專案的 VM-side
# playbook 只用 ansible.builtin.* 模組，沒有用到任何額外 collection，所以
# dependencies 整節省略不寫，只在 additional_build_steps 裡補 podman——
# harbor-install.yml/nginx-proxy-install.yml 的 task 要在容器裡面直接呼叫
# podman 指令。這裡裝的是 EE 自己的 podman 二進位檔（不是把 VM 主機的
# podman 執行檔掛進容器——不同基底映像的共享函式庫版本不一定相容，直接
# 掛執行檔風險更高），實際操作的卻是 VM 主機上真正的狀態：ansible-navigator.yml
# 把 /etc、/home/harbor、/home/nginx-proxy、/run、/var/lib、/var/cache 這些
# 路徑原封不動掛進容器（--privileged --pid=host，見 ansible-navigator.yml 自己
# 的說明——故意不掛整個 /home、也不掛 /opt，理由寫在那份檔案裡），EE 自己
# 的 podman/useradd/systemctl 寫的都是
# 掛進來的這些真實路徑，systemctl 是透過掛進來的 /run/systemd socket 直接
# 跟 VM 主機的 systemd 講話（socket-based IPC，不依賴執行檔本身的函式庫
# 相容性，这塊相對穩）；rootless podman 的 overlay 儲存層（~/.local/share/containers）
# 由這個 EE 容器裡的 podman 直接讀寫掛進來的同一份目錄——這塊有沒有 UID/GID
# 對應上的問題，沒有實機驗證過，是這份檔案目前最大的未知風險，跟專案其他
# 「依通用文件知識寫成、沒有實機驗證過」的部分性質一樣；如果實測發現行不通，
# 退路是把 harbor-install.yml/nginx-proxy-install.yml 改回裸的 ansible-playbook
# 直接在 VM 主機上跑，不透過這個 EE。
version: 3

images:
  base_image:
    name: 'quay.io/ansible/creator-ee:latest'

# ansible-builder 預設走 /usr/bin/dnf，但 quay.io/ansible/creator-ee 這個
# base image 只有 microdnf、沒有 dnf，不指定的話 build 到一半（install-from-
# bindep 這個內建階段）會直接噴 "/usr/bin/dnf: No such file or directory"
# （實機重現過）。這是 ansible-builder 已知、有專門選項處理的狀況，不是
# 這份檔案自己要繞過去的問題。
options:
  package_manager_path: /usr/bin/microdnf

### dependencies 整節不寫——不是寫 null，是乾脆不要有這個 key：這三個欄位的
### schema 是 anyOf [string, array of string]，不包含 null，null 一樣會被嚴格
### 驗證擋下來（jsonschema.exceptions.ValidationError: None is not valid under
### any of the given schemas，實機重現過一次）。不需要任何額外 collection，
### harbor-install.yml/nginx-proxy-install.yml 只用 ansible.builtin.*，省略整節
### 比塞三個 null 更乾淨。

# sudo 是 rootless_podman_user_setup.yml 裡 become: true/become_user 這種
# task 要用的——become 預設走 become_method: sudo，這些 task 是在這個 EE
# 容器裡面執行（不是在 VM 主機上），容器裡沒裝 sudo 一樣會噴 "sudo: command
# not found"（實機重現過）。
#
# build container 不直接連外網，只透過 squid 這個正向代理（full bump，見
# bootstrap/services/squid.sh），所以 microdnf/apt-get 連的 https 目的地
# 在 build container 眼裡其實是 squid 重簽過的憑證，不是對方站台原本的
# 憑證——不信任 squid 的 CA 的話，microdnf/apt-get 會直接把它當成憑證驗證
# 失敗擋下來。squid 的 CA 憑證本身不在這個 build context 裡（放在宿主機
# /etc/squid/ssl_cert/，Containerfile 的 COPY 只能從 context 讀），所以靠
# config.sh 的 ensure_ee_image() 用 podman/buildah build 自己的 --volume
# 擴充語法（不是 Docker BuildKit 的 RUN --mount）把它 bind-mount 進容器
# 固定路徑 /tmp/squidCA.crt，整個 build 過程每個 RUN 都看得到。下面這行
# 把它放進信任鏈——同時 hedge 兩種可能的發行版（RHEL/Fedora 系的
# update-ca-trust、Debian 系的 update-ca-certificates），跟下一行
# microdnf/apt-get 的 `||` hedge 是同一個理由：這個 base image 實際繼承自
# 哪個發行版沒有查證過。proxy 本身的 http_proxy/https_proxy 環境變數不需要
# 寫在這裡——那是 podman build 自己的 --http-proxy（預設 true）機制，從
# 呼叫 podman build 那個行程的環境自動帶進每個 RUN 步驟，config.sh 那邊
# 設定就夠。
additional_build_steps:
  append_base:
    - RUN mkdir -p /etc/pki/ca-trust/source/anchors /usr/local/share/ca-certificates; cp /tmp/squidCA.crt /etc/pki/ca-trust/source/anchors/squidCA.crt 2>/dev/null; cp /tmp/squidCA.crt /usr/local/share/ca-certificates/squidCA.crt 2>/dev/null; update-ca-trust extract 2>/dev/null || update-ca-certificates
    - RUN microdnf install -y podman shadow-utils sudo || (apt-get update && apt-get install -y podman passwd sudo)

# harbor-install.yml/nginx-proxy-install.yml 實際會 pull 的 image 清單（Harbor
# 全家桶 goharbor/* 一套 + nginx-proxy 的 docker.io/library/nginx:stable）記錄在
# 這兩支 playbook 自己檔案裡，不放在這裡——這裡曾經多放過一個 images_used
# 欄位純粹當文件用，但 ansible-builder 用 additionalProperties: False 嚴格驗證
# 這份檔案的每一層，多塞一個它不認得的欄位會直接讓 build 整個失敗
# （jsonschema.exceptions.ValidationError: Additional properties are not
# allowed ('images_used' was unexpected)），所以拿掉。
