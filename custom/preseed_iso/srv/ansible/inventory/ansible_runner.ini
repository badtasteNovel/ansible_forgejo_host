# 給 harbor-install.yml/caddy-proxy-install.yml（透過共用的
# rootless_podman_user_setup.yml）用 delegate_to 連回這台 VM 自己——
# 跟 repo 根目錄的 inventory/windows.ini（控制端連本機 Windows 用）同一個
# 慣例，只是這份是跑在 VM 上、給 ansible-navigator 的 EE 容器用的，所以
# 放在 custom/preseed_iso/srv/ansible/ 底下，跟著整棵 srv/ 樹一起烘焙進
# ISO（見 control-panel/debian.yml 的說明）。
#
# ansible_host 是 10.90.0.1（ansible-builder-network 的 gateway），不是
# 127.0.0.1——EE 容器現在接的是這個 podman network（見
# ansible-navigator.yml container-options，取代原本的 --network=host），
# 容器自己的 127.0.0.1 不等於 host 的 127.0.0.1，連這個位址只會連到容器
# 自己，沒有任何東西在聽（實機撞過 "ssh: connect to host 127.0.0.1 port
# 52222: Connection refused"）。10.90.0.1 這個位址 sshd 有額外監聽
# （preseed.cfg.j2 的 late_command），ufw 也開了對應規則（firewall.sh.j2）。
#
# ansible_port 直接寫死 52222，不是用 .j2 樣板渲染——這是
# playbook/control-panel/debian.yml 的 vm_ssh_port 常數，從頭到尾沒有
# 哪次 build 會不一樣，跟 podman-network.sh 的子網常數是同一個道理，
# 不需要為了一個固定值另外弄一份樣板。10.90.0.1 同理，是
# podman-network.sh 自己釘死的 gateway 常數。
#
# ansible_ssh_private_key_file 指到 /tmp/id_ed25519——這是
# ansible-navigator.yml 的 --secret 掛進容器的那個路徑（run_navigator()
# 每次呼叫前後動態 create/rm 的那把金鑰），不是 /srv/podman/keys/ 裡
# 那份原始私鑰檔案本身，見那兩個檔案自己的說明。
#
# StrictHostKeyChecking=accept-new + 專屬的 UserKnownHostsFile（指到
# 容器自己的 /tmp，不是任何跟 host 共用的路徑）：這台機器對自己的
# sshd host key 本來就是已知、可控的（preseed 裝機時就烘焙好的那把），
# 但容器每次執行都是全新的（--rm），known_hosts 不會跨次殘留，用
# accept-new 讓第一次連線不會卡在互動確認提示，又不用完全關掉驗證
# （StrictHostKeyChecking=no）。
[ansible_runner]
ansible_runner_host ansible_host=10.90.0.1

[ansible_runner:vars]
ansible_connection=ssh
ansible_user=ansible-runner
ansible_ssh_private_key_file=/tmp/id_ed25519
ansible_port=52222
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/ansible_runner_known_hosts
