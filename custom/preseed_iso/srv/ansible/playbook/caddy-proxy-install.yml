---
# nginx 反代安裝 playbook——跟 Harbor 不一樣，這支是強制功能，不是使用者在
# bootstrap-services 表單裡自己選的；但「什麼時候裝」現在也統一由
# bootstrap-services 決定時機（先處理完 Harbor 那塊、registries.conf.d mirror
# 設好之後才觸發這支，這樣這支自己要 pull 的 nginx image 才吃得到 Harbor 的
# pull-through cache），用 ansible-navigator 執行（見 ansible-navigator.yml/Containerfile），
# 不是 systemd 在開機時自動觸發，跑在 VM 自己身上（hosts: localhost,
# connection: local）。
#
# 這個 nginx 是整台 VM 對外的唯一入口，TLS 在這裡集中終止，以後每多一個用
# podman 跑的服務（不只 Harbor），都是在這個 nginx 後面加一個 server block，
# 不需要各自另外開防火牆洞（ufw 只開這支服務自己的對外埠一次，見
# srv/init/firewall.sh.j2）。
#
# 每個服務要給這個 nginx 代理的東西（憑證、vhost conf），都是控制節點裝機前
# 就已經簽好/渲染好、隨 ISO 一起直接注入到 {{ caddy_proxy_home }}/{certs,conf.d}/
# 底下（見 control-panel/debian.yml）——不是先放另一個暫存資料夾、裝好再搬，
# late_command 就直接放進最終位置，這支只負責「把 nginx 這個容器本身架起來」，
# 完全不需要知道後面實際代理了哪些服務、也不需要在執行期跟其他服務的安裝
# playbook 互動（例如 harbor-install.yml 完全不會回頭去改這支 playbook 產生
# 的任何東西）——Harbor 的 vhost conf/憑證現在無條件烘焙進 ISO，conf.d/certs
# 底下一定會有 Harbor 那份，以後新增其他服務也是一樣的模式，直接多幾個檔案，
# 不需要這支自己處理。
#
# 全程以 caddy-proxy 這個 rootless 專屬系統使用者的身份跑 podman/systemctl --user
# （容器逃逸拿不到主機 root，也跟 harbor 使用者彼此隔離），rootless 使用者設置
# 那段跟 harbor-install.yml 共用同一份 custom/preseed_iso/srv/ansible/playbook/rootless_podman_user_setup.yml。
#
# caddy-proxy 容器用 --network=host，不是 -p 單純 port mapping：它要反代的
# 後端（Harbor 之類）是「另一個 rootless 使用者」自己的 podman-compose 服務，
# 綁在 VM 主機的 127.0.0.1 上（見 harbor-install.yml 限制 proxy service port
# 那段）。如果 caddy-proxy 用自己獨立的 network namespace（-p 的預設行為），
# 它容器內的 127.0.0.1 只會指向自己，完全摸不到主機的 127.0.0.1，等於永遠連
# 不到任何後端。--network=host 讓 nginx 直接共用 VM 主機的網路堆疊，才能用
# 127.0.0.1 連到其他 rootless 使用者各自發布在主機 loopback 上的服務——也因為
# 這樣，nginx 自己的 server block 要明確 listen {{ wireguard_vm_address }}，
# 不能只寫埠號（host network 下不寫位址會變成監聽主機所有介面，等於繞過
# sshd 那種「只綁 WireGuard 位址」的既有慣例）。

- name: '在 VM 上把 nginx 反代架起來（podman，rootless，TLS 集中終止）'
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - /srv/ansible/playbook/caddy_proxy_runtime_vars.yml

  vars:
    caddy_proxy_https_port: 443 # 整台 VM 唯一對外開放的埠，寫死常數——跟 control-panel/debian.yml、config.sh、harbor-install.yml 裡的同名值待遇一樣，從來不是每台 VM 不一樣的東西，不需要透過 caddy_proxy_runtime_vars.yml 渲染進來，這裡只拿來組最後印出來的那行訊息
    caddy_proxy_sites_dir: "{{ caddy_proxy_home }}/conf.d"
    caddy_proxy_cert_dir: "{{ caddy_proxy_home }}/certs"
    caddy_proxy_image: "docker.io/library/nginx:stable"

  tasks:
    # ────────────────────────── rootless 使用者 ──────────────────────────

    - name: '建立 caddy-proxy 這個 rootless 專屬系統使用者'
      ansible.builtin.include_tasks:
        file: /srv/ansible/playbook/rootless_podman_user_setup.yml # 原始檔是 custom/preseed_iso/srv/ansible/playbook/rootless_podman_user_setup.yml，跟著整棵 srv/ 樹裝機前由 control-panel/debian.yml 複製進 ISO——這支 playbook 跑在 VM 上，摸不到控制節點的 repo，只能吃注入進來的這份
      vars:
        rootless_user_name: "{{ caddy_proxy_user }}"
        rootless_service_dirs:
          - "{{ caddy_proxy_home }}"
          - "{{ caddy_proxy_sites_dir }}"
          - "{{ caddy_proxy_cert_dir }}"

    # ────────────────────────── 信任庫 ──────────────────────────
    # 每個服務的 CA/leaf 憑證、vhost conf 已經由控制節點簽好/渲染好、隨 ISO
    # 直接注入到 {{ caddy_proxy_cert_dir }}/{{ caddy_proxy_sites_dir }}（不是先放
    # 另一個暫存資料夾、裝好再搬），擁有者/權限也已經由上面「建立 caddy-proxy
    # 這個 rootless 專屬系統使用者」那步的 recurse: true chown 處理掉了，這裡
    # 不需要再搬一次。

    - name: '把 CA 灌進系統信任庫（這台機器上的 podman/buildah/curl 要信任自己這個 nginx 簽出來的憑證——以後這台 VM 當 k3s host 時，本機自己 pull 自己背後的服務也要用到）'
      ansible.builtin.copy:
        src: "{{ caddy_proxy_cert_dir }}/ca.crt"
        dest: /usr/local/share/ca-certificates/caddy-proxy-ca.crt
        remote_src: true
        mode: "0644"
      register: ca_trust_copy

    - name: 'update-ca-certificates（只有真的換了 CA 才需要重跑）'
      ansible.builtin.command: update-ca-certificates
      when: ca_trust_copy is changed
      changed_when: true

    # ────────────────────────── 起服務 ──────────────────────────

    - name: 'pull nginx image'
      ansible.builtin.command: podman pull {{ caddy_proxy_image }}
      become: true
      become_user: "{{ caddy_proxy_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true

    - name: '建 ~caddy-proxy/.config/systemd/user/（daemon-reload 前要先有目錄）'
      ansible.builtin.file:
        path: "/home/{{ caddy_proxy_user }}/.config/systemd/user"
        state: directory
        owner: "{{ caddy_proxy_user }}"
        group: "{{ caddy_proxy_user }}"
        mode: "0750"

    - name: '裝 systemd **user** unit（~caddy-proxy/.config/systemd/user，靠 linger 開機自動起）'
      ansible.builtin.copy:
        dest: "/home/{{ caddy_proxy_user }}/.config/systemd/user/caddy-proxy.service"
        owner: "{{ caddy_proxy_user }}"
        group: "{{ caddy_proxy_user }}"
        mode: "0644"
        content: |
          [Unit]
          Description=nginx reverse proxy (rootless podman, TLS termination for every service behind it)
          After=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStartPre=-/usr/bin/podman rm -f caddy-proxy
          ExecStart=/usr/bin/podman run -d --name caddy-proxy --network=host \
            -v {{ caddy_proxy_sites_dir }}:/etc/nginx/conf.d:z,ro \
            -v {{ caddy_proxy_cert_dir }}:/etc/caddy/certs:z,ro \
            {{ caddy_proxy_image }}
          ExecStop=/usr/bin/podman stop caddy-proxy
          Restart=on-failure
          RestartSec=15

          [Install]
          WantedBy=default.target

    - name: 'systemctl --user daemon-reload + enable + start caddy-proxy.service'
      ansible.builtin.command: "{{ item }}"
      become: true
      become_user: "{{ caddy_proxy_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true
      loop:
        - systemctl --user daemon-reload
        - systemctl --user enable --now caddy-proxy.service

    - name: '確認 caddy-proxy 容器真的跑起來了'
      ansible.builtin.command: podman ps --filter name=caddy-proxy --filter status=running --format {% raw %}'{{.Names}}'{% endraw %} # {% raw %}...{% endraw %} 包起來，不然 Ansible 自己的 Jinja2 會把 podman 的 Go template 語法一起吃掉
      become: true
      become_user: "{{ caddy_proxy_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: false
      register: caddy_proxy_running_check
      retries: 10
      delay: 3
      until: caddy_proxy_running_check.stdout | trim == 'caddy-proxy'

    # ────────────────────────── 收尾 ──────────────────────────

    - name: '數一下目前有幾個 vhost conf（純粹給下面印結果用）'
      ansible.builtin.find:
        paths: "{{ caddy_proxy_sites_dir }}"
        file_type: file
      register: caddy_proxy_site_files

    - name: '印出結果（journalctl -u bootstrap-caddy-proxy 看得到這段）'
      ansible.builtin.debug:
        msg:
          - "nginx 反代已就緒，監聽 {{ wireguard_vm_address }}:{{ caddy_proxy_https_port }}（只能從 WireGuard 隧道連）"
          - "目前代理的服務數量：{{ caddy_proxy_site_files.files | length }}（每多裝一個服務，這裡會多一個 vhost）"
