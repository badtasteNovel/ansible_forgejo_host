# rootless podman 專屬系統使用者的 linger + 服務目錄 + 驗證 podman 能動。
# Harbor（harbor-install.yml）跟 caddy-proxy（caddy-proxy-install.yml）都
# 需要一模一樣的這套設置——容器逃逸拿不到主機 root，每個服務各自一個
# 獨立使用者、彼此隔離——抽成共用 task fragment，避免兩份幾乎一樣的
# 程式碼（以後每多一個用 podman 跑的服務，也是直接 include 這份，不用
# 再複製貼上一次）。
#
# useradd + subuid/subgid 不在這裡建——搬到 preseed.cfg.j2 的 late_command
# 去了（見該檔案自己在 late_command 開頭的說明）：harbor/caddy-proxy 是
# build 時就知道的固定帳號名稱，不需要等到這支 playbook 執行期才建，
# 搬過去之後 ansible-navigator.yml 才不用整個掛 /etc 進 EE 容器。
#
# 呼叫端要先用 vars: 定義：
#   rootless_user_name    - 使用者名稱
#   rootless_service_dirs - 要 chown 給這個使用者的目錄清單
#
# 跑完之後可以用的 fact：rootless_podman_env
# （XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS/HOME，掛在後面所有要以這個
# 使用者身份跑 podman/podman-compose/systemctl --user 的 task 的 environment: 上）
#
# 這份檔案跟 harbor-install.yml/caddy-proxy-install.yml 裡其他真正呼叫
# podman（podman load/run/pull、podman-compose up、systemctl --user）的
# task，一律要帶 delegate_to: ansible_runner_host——這個 host 定義在
# /srv/ansible/inventory/ansible_runner.ini（run_navigator() 呼叫
# ansible-navigator 時用 -i 帶進去，見 config.sh 自己的說明），讓這些
# 操作真的透過 SSH 連回這台 VM 自己的 127.0.0.1（ansible-runner 帳號，
# 再 become 到 harbor/caddy-proxy）執行，不是在 EE 容器裡直接執行、靠
# bind mount 碰 host 狀態。沒有 delegate_to 的 task（linger、chown 服務
# 目錄這類）維持原樣在容器裡執行，沒有任何變化。

- name: "開 linger（{{ rootless_user_name }} 的 systemd user instance 開機自動起，rootless service 要用；podman info/systemctl --user 都要靠 /run/user/<uid> 存在）"
  ansible.builtin.command: loginctl enable-linger {{ rootless_user_name }}
  changed_when: true

- name: "查 {{ rootless_user_name }} 使用者的 uid（組 XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS 要用）"
  ansible.builtin.getent:
    database: passwd
    key: "{{ rootless_user_name }}"

# 這份 registry 登入憑證檔原本是直接掛 /etc/containers 進 EE 容器去讀
# host 上的 /etc/containers/mirror-auth.json——但這個容器對這個檔案
# 從頭到尾只有「讀」，從來沒有寫回去過（寫入是 harbor.sh 在 host 上
# 自己做的，見該腳本 harbor_finalize() 的說明），為了唯讀一個檔案去掛
# 整個目錄沒有必要。改成由呼叫端（caddy.sh/harbor.sh/update.sh）在
# host 上讀出這份檔案的內容、base64 編碼後用 --extra-vars 傳進來，這裡
# 收到之後寫進容器自己的 /tmp（不需要、也不會寫回 host，純粹讀取用）。
# mirror_auth_content_b64 預設是空字串——第一次執行 bootstrap-services
# 時，harbor_finalize() 還沒跑過，host 上根本沒有這個檔案，呼叫端傳進來
# 的就會是空值，這裡不寫檔案，REGISTRY_AUTH_FILE 指到一個不存在的路徑，
# podman 的行為跟「這個環境變數本來就沒設」一樣（等同匿名 pull）——跟
# 原本掛載方式在同一個情境下的行為一致，不是新引入的差異。
- name: "把呼叫端傳進來的 mirror-auth 內容（host 上 /etc/containers/mirror-auth.json 的內容，如果當下已經存在）寫進容器自己的暫存路徑，純讀取用，不需要掛載 /etc/containers"
  ansible.builtin.copy:
    content: "{{ mirror_auth_content_b64 | default('') | b64decode }}"
    dest: /tmp/mirror-auth.json
    mode: "0644"
  when: (mirror_auth_content_b64 | default('')) | length > 0

- name: "組 rootless 執行環境變數，後面所有要以 {{ rootless_user_name }} 身份跑的 task 都掛這個"
  ansible.builtin.set_fact:
    rootless_podman_env:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[rootless_user_name][1] }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[rootless_user_name][1] }}/bus"
      HOME: "/home/{{ rootless_user_name }}"
      # podman pull/run 內部處理多 UID layer 時會在 TMPDIR（沒設的話預設
      # /var/tmp）底下建暫存目錄；這裡所有 become_user 的 task 都是透過
      # ansible-navigator 的 EE 容器跑（見 ansible-navigator.yml），容器裡的
      # /var/tmp 只是 image 自己本地的 overlay 檔案系統（不是 volume-mounts
      # 掛進來的任何東西），不是真正落在主機磁碟上的路徑——實機撞過
      # podman pull 直接噴 "creating a temporary directory: mkdir
      # /var/tmp/container_images_storage...: no such file or directory"，
      # 即便直接用 mkdir 手動測試同一個路徑完全沒問題，podman 自己內部的
      # 多 UID 重新執行機制在這種 overlay-on-overlay 的巢狀結構下就是不行。
      # 改指到 {{ rootless_user_name }} 自己的家目錄（volume-mounts 有明確
      # 掛進來、是貨真價實落在主機磁碟上的路徑）就能繞開這個問題。
      TMPDIR: "/home/{{ rootless_user_name }}/tmp"
      # 見上面那個 copy task 的說明——這裡指到容器自己的暫存路徑，不是
      # host 上 /etc/containers/mirror-auth.json 的原始路徑。
      REGISTRY_AUTH_FILE: /tmp/mirror-auth.json

- name: "建 {{ rootless_user_name }} 自己的 tmp 目錄（給上面的 TMPDIR 用，繞開容器內 /var/tmp 的問題）"
  ansible.builtin.file:
    path: "/home/{{ rootless_user_name }}/tmp"
    state: directory
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0750"

- name: "建 {{ rootless_user_name }} 的 ~/.config/containers/（cgroup_manager 設定檔要放的目錄）"
  ansible.builtin.file:
    path: "/home/{{ rootless_user_name }}/.config/containers"
    state: directory
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0750"

- name: "cgroup_manager 改用 cgroupfs（harbor/caddy-proxy 各自用自己的 rootless podman 再啟動巢狀容器——harbor 是 goharbor/prepare，caddy-proxy 未來任何用 podman run 跑子容器的流程都一樣——預設的 systemd cgroup manager 會假設自己能直接摸到 /sys/fs/cgroup/user.slice 這種路徑，但這兩個都只是沒有真正主機級權限的 rootless 使用者，--privileged 在這裡只在它自己的 user namespace 內有效，沒辦法真的加入主機的 cgroup namespace——實機撞過 crun 直接噴 'create directory `/sys/fs/cgroup/.../user.slice`: No such file or directory: OCI runtime attempted to invoke a command that was not found'。改成 cgroupfs 之後 crun 直接操作它實際摸得到的 cgroup 檔案系統，不再假設一套它沒有權限建立的 systemd 式路徑——這個設定寫在 containers.conf，對這個使用者之後所有 podman 呼叫都生效，不用每個指令各自加 --cgroup-manager=cgroupfs，podman-compose 內部呼叫的每一個 podman run 也會一併吃到這個設定）"
  ansible.builtin.copy:
    dest: "/home/{{ rootless_user_name }}/.config/containers/containers.conf"
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0640"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"

- name: "服務目錄（chown 給 {{ rootless_user_name }}，遞迴——late_command 裝機當下已經把設定檔/憑證這些東西直接放進最終位置了（不是先放暫存資料夾、裝好再搬），這些目錄第一次被這個 task 碰到的時候裡面可能已經有 root 擁有的檔案，recurse: true 才能把裡面現有的東西一起改成這個使用者）"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0750"
    recurse: true
  loop: "{{ rootless_service_dirs }}"

- name: "{{ rootless_user_name }} 服務目錄最上層額外加 o+x（不開讀取，只開「可以經過」——rootless 容器裡常常不是用這個使用者自己的身份跑，而是 image 自己 Dockerfile 指定的某個非 root UID，例如 Harbor 的 nginx-photon 內部是 UID 10000，對應到 host 端是 harbor 的 subuid 映射區段裡的某個號碼，既不是 {{ rootless_user_name }} 本人也不在它的 group 裡；上面那個 task 把最上層目錄設成 0750，這種非 root UID 連第一層都進不去，不管再往下哪一層的檔案/目錄權限開多寬都沒用——Unix 的路徑解析規則是「每一層目錄都要有 x 權限才能繼續往下走」。實機撞過：goharbor/prepare 自己已經把 nginx.conf 正確設成 nginx 容器內部 UID 對應的擁有者、檔案本身的 mode 也沒問題，但 nginx 服務開機時直接 'open() \"/etc/nginx/nginx.conf\" failed (13: Permission denied)' crash-loop，根因不在 nginx.conf 或它的直接上層目錄，是在最上層的 harbor_home/caddy_proxy_home 本身卡住了整條路徑。只加 x、不加 r——敏感檔案本身的內容保護靠檔案自己的 mode（harbor.yml 是 0640、secrets/ 是 0700），不是靠擋住路徑讓人進不去，這裡鬆開 o+x 不會讓內容變得可讀，只是讓『存在哪個路徑』這件事變得可被發現，跟內容洩漏是兩件事）"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "o+x"
  loop: "{{ rootless_service_dirs }}"

- name: "確保 {{ rootless_user_name }} 的 ~/.config 存在（podman 的 rootless 設定/儲存層設定檔都靠 XDG_CONFIG_HOME 預設值找這個目錄，實機撞過 podman info 直接噴 'stat /home/.../.config: no such file or directory'——create_home: true 只會從 /etc/skel 複製標準骨架檔案，.config 不是標準骨架的一部分，不會自動生出來）"
  ansible.builtin.file:
    path: "/home/{{ rootless_user_name }}/.config"
    state: directory
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0750"

- name: "驗證 rootless podman 能動（確保後面的步驟不會卡在 linger/subuid 沒生效；故意不用 podman info——這支指令內部會另外去查詢 cgroup controller/libpod 設定目錄這類只有在真正走過 PAM session 註冊的行程下才會穩定成功的診斷資訊，用 become_user 這種單純切身份的呼叫方式跑，實機交叉驗證過多次：有時噴 'getting available cgroup controllers: ... no such file or directory'，有時噴 'mkdir /run/user/<uid>/libpod: permission denied'，兩種訊息在同一套環境下都出現過，顯然是 podman info 這個子指令自己對執行環境的假設跟這裡的呼叫方式不匹配，不是設定錯誤。podman ps 走的是完全不同的程式碼路徑，不會碰這些診斷查詢，而且是這份 playbook 後面幾個 task、以及 harbor-install.yml/caddy-proxy-install.yml 真正會用到的操作本身，用 podman pull/podman run 分別交叉測試過，在同樣的 become_user 呼叫方式、同樣的 ansible-navigator EE 容器環境下都穩定成功——podman ps 才是真正代表『rootless podman 能不能用』的查驗，不是 podman info 的診斷輸出）"
  ansible.builtin.command: podman ps
  delegate_to: ansible_runner_host
  become: true
  become_user: "{{ rootless_user_name }}"
  environment: "{{ rootless_podman_env }}"
  changed_when: false
  register: rootless_podman_check
  retries: 100 # 跟其他幾個 wait_for 一樣拉長：重試這個指令一旦成功就會立刻回來，拉大這個數字不影響正常情況下的等待時間，只是把「真的卡住」的判定門檻放寬（100 次 * delay 3 秒 ≈ 5 分鐘）
  delay: 3
  until: rootless_podman_check.rc == 0

- name: "重置 {{ rootless_user_name }} 的 rootless podman pause process（上面那個 podman ps 是這個使用者第一次呼叫 podman，這個呼叫本身就會順便建立 podman 的 rootless pause process——這個 process 會一路留著、之後每一次 podman 呼叫都 setns 進它那個 mount namespace，不是每次重新建立；實機撞過：這個第一次建立的 pause process 本身的 mount namespace 裡看不到 /etc/resolv.conf/var/tmp，導致後面任何用到 rootless bridge 網路的 podman run/podman-compose up 一律在 start 階段噴 'rootless netns: mount resolv.conf to \"/etc/resolv.conf\": no such file or directory'——用 strace 追過，問題出在這個 pause process 自己的狀態，不是任何網路/image/DNS 參數/cgroup manager 設定，把這個 process kill 掉、讓 podman system migrate 重新建一個全新的，問題就消失了。podman system migrate 的官方用途正是『清掉舊的 pause process、下次呼叫重新建立』，比自己手動 pkill 可靠，而且不用先知道 pause.pid 在哪個路徑）"
  ansible.builtin.command: podman system migrate
  delegate_to: ansible_runner_host
  become: true
  become_user: "{{ rootless_user_name }}"
  environment: "{{ rootless_podman_env }}"
  changed_when: true
