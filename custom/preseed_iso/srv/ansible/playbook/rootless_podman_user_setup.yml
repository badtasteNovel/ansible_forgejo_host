# 建一個 rootless podman 專屬系統使用者（useradd + subuid/subgid + linger +
# 服務目錄 + 驗證 podman 能動）。Harbor（harbor-install.yml）跟 nginx-proxy
# （nginx-proxy-install.yml）都需要一模一樣的這套設置——容器逃逸拿不到主機
# root，每個服務各自一個獨立使用者、彼此隔離——抽成共用 task fragment，
# 避免兩份幾乎一樣的程式碼（以後每多一個用 podman 跑的服務，也是直接
# include 這份，不用再複製貼上一次）。
#
# 呼叫端要先用 vars: 定義：
#   rootless_user_name    - 使用者名稱
#   rootless_service_dirs - 要 chown 給這個使用者的目錄清單
#
# 跑完之後可以用的 fact：rootless_podman_env
# （XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS/HOME，掛在後面所有要以這個
# 使用者身份跑 podman/podman-compose/systemctl --user 的 task 的 environment: 上）

- name: 建立 {{ rootless_user_name }} 這個 rootless 專屬系統使用者
  ansible.builtin.user:
    name: "{{ rootless_user_name }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: 檢查 {{ rootless_user_name }} 使用者有沒有 subuid 條目
  ansible.builtin.command: grep -q "^{{ rootless_user_name }}:" /etc/subuid
  register: rootless_subuid_check
  changed_when: false
  failed_when: false

- name: 檢查 {{ rootless_user_name }} 使用者有沒有 subgid 條目
  ansible.builtin.command: grep -q "^{{ rootless_user_name }}:" /etc/subgid
  register: rootless_subgid_check
  changed_when: false
  failed_when: false

- name: 補 subuid/subgid（Debian 的 useradd 不一定會自動配，rootless podman 的 user namespace 映射需要這個）
  ansible.builtin.shell: |
    set -euo pipefail
    NEXT=$(awk -F: 'BEGIN{m=100000}{e=$2+$3; if(e>m)m=e}END{print m}' /etc/subuid)
    usermod --add-subuids "${NEXT}-$((NEXT+65535))" --add-subgids "${NEXT}-$((NEXT+65535))" {{ rootless_user_name }}
  args:
    executable: /bin/bash
  when: rootless_subuid_check.rc != 0 or rootless_subgid_check.rc != 0
  changed_when: true

- name: 開 linger（{{ rootless_user_name }} 的 systemd user instance 開機自動起，rootless service 要用；podman info/systemctl --user 都要靠 /run/user/<uid> 存在）
  ansible.builtin.command: loginctl enable-linger {{ rootless_user_name }}
  changed_when: true

- name: 查 {{ rootless_user_name }} 使用者的 uid（組 XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS 要用）
  ansible.builtin.getent:
    database: passwd
    key: "{{ rootless_user_name }}"

- name: 組 rootless 執行環境變數，後面所有要以 {{ rootless_user_name }} 身份跑的 task 都掛這個
  ansible.builtin.set_fact:
    rootless_podman_env:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[rootless_user_name][1] }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[rootless_user_name][1] }}/bus"
      HOME: "/home/{{ rootless_user_name }}"
      # 所有 rootless 使用者共用同一份 registry 登入憑證檔——bootstrap-services
      # 選好要用哪個 Harbor（本機裝的或外部指定的）之後，登入動作只做一次、寫
      # 進這個共用檔案，不需要每個 rootless 使用者各自登入一次。這個檔案由
      # bootstrap-services 用 root 身份寫，故意設成所有人都讀得到（見該程式
      # 自己的說明），不是每個使用者自己的 ~/.config/containers/auth.json。
      REGISTRY_AUTH_FILE: /etc/containers/mirror-auth.json

- name: 服務目錄（chown 給 {{ rootless_user_name }}，遞迴——late_command 裝機當下已經把設定檔/憑證這些東西直接放進最終位置了（不是先放暫存資料夾、裝好再搬），這些目錄第一次被這個 task 碰到的時候裡面可能已經有 root 擁有的檔案，recurse: true 才能把裡面現有的東西一起改成這個使用者）
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rootless_user_name }}"
    group: "{{ rootless_user_name }}"
    mode: "0750"
    recurse: true
  loop: "{{ rootless_service_dirs }}"

- name: 驗證 rootless podman 能動（確保後面的步驟不會卡在 linger/subuid 沒生效）
  ansible.builtin.command: podman info
  become: true
  become_user: "{{ rootless_user_name }}"
  environment: "{{ rootless_podman_env }}"
  changed_when: false
  register: rootless_podman_check
  retries: 5
  delay: 3
  until: rootless_podman_check.rc == 0
