---
# Harbor 安裝 playbook——是不是要裝、什麼時候裝，現在是 VM 開機後使用者自己
# 手動跑 bootstrap-services（見 custom/scripts/bootstrap-services/）互動問出來
# 的決定，不是裝機當下自動的。bootstrap-services 選了「要在本機裝 Harbor」
# 之後，用 ansible-navigator（不是裸的 ansible-playbook，見 execution-environment.yml）
# 執行這支檔案，跑在 VM 自己身上（hosts: localhost, connection: local）。
#
# 邏輯對照 lg-laravel 專案 scripts/tasks/podman-deploy/harbor.yaml 的
# preflight → cert → install → configure-proxy-cache 這條流程搬過來的，主要差異：
#   - cert 那步整個拿掉：Harbor 自己完全不碰 TLS，只在 127.0.0.1 上講明文 HTTP
#     （見下面限制 proxy service port 那段）。TLS 統一由獨立的 nginx 反代
#     （nginx-proxy，見 custom/config/debian_preseed_iso/nginx_proxy/）集中終止
#     ——CA/leaf 憑證是控制節點裝機前用 community.crypto 簽好、隨 ISO注入到
#     nginx-proxy 的暫存資料夾（不是這支 playbook 的暫存資料夾），這支完全不碰
#     憑證檔案，也不用把 CA 灌進系統信任庫（那是 nginx-proxy-install.yml 的事）。
#   - 密碼不是存 pass（GPG 密碼管理工具，這個專案沒有這套東西）：admin/db 密碼
#     來自 custom/.env，裝機前就渲染進 harbor_runtime_vars.yml 一起注入；robot
#     帳號的 secret 是真正的執行期產物，裝好之後存在本機檔案（見最後一個 play）。
#   - 沒有「偵測到既有安裝、要不要清掉重裝」那段互動確認：bootstrap-services
#     自己會擋「已經裝過了還要再裝一次」的情況（見該程式自己的說明），這支
#     playbook 不用自己防呆。
#   - 多上游 proxy-cache（PROXY_MAP）／robot 拉取帳號／GC 排程整段保留——這台 VM
#     以後要當 k3s host 用時，本機 Harbor 就是現成可以掛的 pull-through cache。
#
# 全程以 harbor 這個 rootless 專屬系統使用者的身份跑 podman / podman-compose /
# systemctl --user（容器逃逸拿不到主機 root），對應 lg-laravel 專案
# scripts/bin/rootless-podman.sh 的 rootless_user_run，這裡用 become_user +
# environment 做一樣的事。rootless 使用者設置那段跟 nginx-proxy-install.yml
# 共用同一份 /opt/bootstrap/common/rootless_podman_user_setup.yml（原始檔是
# custom/scripts/tasks/ansible/rootless_podman_user/setup.yml）。

- name: 在 VM 上把 Harbor pull-through cache 鏡像站架起來（podman-compose，rootless）
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - /opt/bootstrap/harbor/harbor_runtime_vars.yml

  vars:
    harbor_staging_dir: /opt/bootstrap/harbor # late_command 複製進來的暫存位置（harbor 使用者裝機當下還不存在，late_command 沒辦法直接 chown 給它）
    harbor_installer_cache: /var/cache/harbor-installer
    harbor_tgz_name: "harbor-offline-installer-{{ harbor_version }}.tgz"
    harbor_tgz_cached_path: "{{ harbor_installer_cache }}/{{ harbor_tgz_name }}"
    # proxy project <-> 上游對照：project 名稱、Harbor registry endpoint 名稱、
    # endpoint 類型、上游 URL、（給 bootstrap-services 寫 registries.conf.d mirror
    # 用的）上游 registry hostname。原始內容是 custom/config/debian_preseed_iso/harbor/proxy_map.json
    # 這一份靜態檔案，裝機前隨 ISO 注入到跟 harbor.yml/harbor-install.yml 同一個
    # 暫存資料夾（{{ harbor_staging_dir }}）——這份資料是 Harbor 自己的東西，不是
    # harbor/nginx-proxy 兩邊共用的，所以沒有放進 /opt/bootstrap/common/。
    # bootstrap-services（Go 程式）不管選哪個分支（本機裝還是接外部既有的）都要
    # 讀同一份來寫 registries.conf.d mirror，所以這支 playbook 最後清暫存檔案時
    # 特意不動這一份（見下面「清掉這支 playbook 自己用過的暫存檔案」那個 task）。
    # 這支 playbook 跟 bootstrap-services 都讀同一份，不是各自維護一份容易
    # 兜不起來的複本（lg-laravel 專案 PROXY_MAP 分散在三處維護，就是這裡刻意要
    # 避開的問題）。
    proxy_map: "{{ lookup('file', harbor_staging_dir + '/proxy_map.json') | from_json }}"
    harbor_project_quota_bytes: 16106127360 # 15GiB；8 個 proxy project × 15GiB = 120GiB，留約 30GB 給 postgres/redis/trivy + 邊際（vm_disk_harbor_gb 整顆抓 150GB）
    robot_name: mirror-puller
    harbor_api_base: "http://127.0.0.1:{{ harbor_internal_http_port }}/api/v2.0" # 本機直連明文 HTTP，不透過 nginx-proxy——這支 playbook 本來就跑在 VM 自己身上，不需要繞一圈去過 TLS
    harbor_secrets_dir: /opt/harbor/secrets # 執行期才生得出來的機密（robot secret）存這裡，root-only 可讀，對照這個專案 custom/.env 明文存機密的風格

  tasks:
    # ────────────────────────── rootless 使用者 ──────────────────────────

    - name: 建立 harbor 這個 rootless 專屬系統使用者
      ansible.builtin.include_tasks:
        file: /opt/bootstrap/common/rootless_podman_user_setup.yml # 原始檔是 custom/scripts/tasks/ansible/rootless_podman_user/setup.yml，裝機前由 control-panel/debian.yml 複製進 ISO——跟 nginx-proxy-install.yml 共用同一份
      vars:
        rootless_user_name: "{{ harbor_user }}"
        rootless_service_dirs:
          - "{{ harbor_home }}"
          - "{{ vm_harbor_mount_path }}"
          - "{{ harbor_installer_cache }}"

    # ────────────────────────── 設定檔就位 ──────────────────────────
    # harbor.yml 已經由控制節點渲染好、隨 ISO 注入到 {{ harbor_staging_dir }}，
    # 這裡要搬到 harbor 使用者讀得到的最終位置——不是隨便選的路徑，goharbor/prepare
    # 這個容器是靠 -v {{ harbor_home }}:/input:z 掛進去讀 harbor.yml 的（見下面
    # 「跑 goharbor/prepare」那個 task），檔案一定要放在 harbor_home 底下，
    # prepare 才找得到。
    #
    # 用 mv（ansible.builtin.command）不是 ansible.builtin.copy：harbor.yml
    # 裡面有 harbor_admin_password/database.password 明文密碼，copy 的話會讓
    # 同一份密碼在磁碟上同時存在兩份（暫存那份要等 playbook 最後「收尾」那段
    # 才會清掉），mv 讓暫存那份當場就消失，密碼不會有重複存在的空窗期。沒有
    # 憑證要搬——Harbor 自己完全不碰 TLS（見下面限制 proxy service port 那段），
    # 憑證是 nginx-proxy 的事，不是這支 playbook 的事。

    - name: 搬 harbor.yml 到 {{ harbor_home }}（mv，不留暫存副本——這個檔案裡有明文密碼）
      ansible.builtin.command: mv {{ harbor_staging_dir }}/harbor.yml {{ harbor_home }}/harbor.yml
      changed_when: true

    - name: 把搬過去的 harbor.yml 擁有者/權限改成 harbor 使用者
      ansible.builtin.file:
        path: "{{ harbor_home }}/harbor.yml"
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        mode: "0640"

    # ────────────────────────── 下載／校驗 offline installer ──────────────────────────

    - name: 查詢 GitHub release 上這個版本 installer 的官方 sha256（digest 欄位）
      ansible.builtin.uri:
        url: "https://api.github.com/repos/goharbor/harbor/releases/tags/{{ harbor_version }}"
        return_content: true
      register: harbor_release_info

    - name: 算出 installer tgz 的官方 digest
      ansible.builtin.set_fact:
        harbor_tgz_digest: "{{ harbor_release_info.json.assets | selectattr('name', 'equalto', harbor_tgz_name) | map(attribute='digest') | first }}"

    - name: 擋下「GitHub API 查不到這個版本/這個檔名」的情況（digest 查不到，後面下載也沒有東西可以校驗，不該悶著頭繼續）
      ansible.builtin.assert:
        that:
          - harbor_tgz_digest is defined
          - harbor_tgz_digest | length > 0
        fail_msg: "GitHub release {{ harbor_version }} 裡找不到 {{ harbor_tgz_name }} 的官方 sha256，中止安裝（可能是版本號打錯，或 GitHub API 被限流）"

    - name: 下載 Harbor offline installer（已快取就跳過；get_url 本身會校驗 checksum，對不上直接失敗，不會留下半調子的檔案）
      ansible.builtin.get_url:
        url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/{{ harbor_tgz_name }}"
        dest: "{{ harbor_tgz_cached_path }}"
        checksum: "{{ harbor_tgz_digest }}"
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        mode: "0644"
        timeout: 300

    - name: 解壓 bundle 到 {{ harbor_home }}（對應 tar --strip-components=1，installer tgz 裡面多包了一層目錄）
      ansible.builtin.unarchive:
        src: "{{ harbor_tgz_cached_path }}"
        dest: "{{ harbor_home }}"
        remote_src: true
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        extra_opts:
          - --strip-components=1

    - name: podman load image bundle（進 harbor 使用者的 image store）
      ansible.builtin.command: podman load -i {{ harbor_home }}/harbor.{{ harbor_version }}.tar.gz
      become: true
      become_user: "{{ harbor_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true

    # ────────────────────────── prepare → 起服務 ──────────────────────────

    - name: 建 common/config（goharbor/prepare 要寫進去的設定目錄）
      ansible.builtin.file:
        path: "{{ harbor_home }}/common/config"
        state: directory
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        mode: "0750"

    - name: 跑 goharbor/prepare（產生 docker-compose.yml + common/config/*；--privileged 只在 user namespace 內有效，不是真的拿到主機 root）
      ansible.builtin.command: >
        podman run --rm --privileged --pull=never
        -v {{ harbor_home }}:/input:z
        -v {{ vm_harbor_mount_path }}:/data:z
        -v {{ harbor_home }}:/compose_location:z
        -v {{ harbor_home }}/common/config:/config:z
        -v /:/hostfs
        goharbor/prepare:{{ harbor_version }} prepare --with-trivy
      become: true
      become_user: "{{ harbor_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true

    - name: 移除 prepare 產出 docker-compose.yml 裡的 log service（image 內部用 sudo 切使用者，rootless 下讀不到 /etc/shadow 會 crash-loop；log 改走 journald），並把 proxy service 對外發布的埠限制在 127.0.0.1（Harbor 自己完全不對外，nginx-proxy 用 --network=host 連這個 loopback 埠，外部摸不到）
      ansible.builtin.command: >
        yq -i '
          del(.services.log)
          | (.services[] | select(has("depends_on")).depends_on) |= map(select(. != "log"))
          | .services[].logging = {"driver": "journald"}
          | .services.proxy.ports = ["127.0.0.1:{{ harbor_internal_http_port }}:8080"]
        ' {{ harbor_home }}/docker-compose.yml
      become: true
      become_user: "{{ harbor_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true

    - name: podman-compose up -d
      ansible.builtin.command: podman-compose -f {{ harbor_home }}/docker-compose.yml up -d
      become: true
      become_user: "{{ harbor_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true

    - name: 查 podman-compose 的絕對路徑（systemd unit 的 ExecStart 要用絕對路徑，不能依賴 PATH）
      ansible.builtin.command: command -v podman-compose
      args:
        executable: /bin/bash
      changed_when: false
      register: harbor_podman_compose_path

    - name: 建 ~harbor/.config/systemd/user/（daemon-reload 前要先有目錄）
      ansible.builtin.file:
        path: "/home/{{ harbor_user }}/.config/systemd/user"
        state: directory
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        mode: "0750"

    - name: 裝 systemd **user** unit（~harbor/.config/systemd/user，靠 linger 開機自動起）
      ansible.builtin.copy:
        dest: "/home/{{ harbor_user }}/.config/systemd/user/harbor.service"
        owner: "{{ harbor_user }}"
        group: "{{ harbor_user }}"
        mode: "0644"
        content: |
          [Unit]
          Description=Harbor pull-through cache mirror (rootless podman-compose)
          After=network-online.target
          RequiresMountsFor={{ vm_harbor_mount_path }}

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ harbor_home }}
          ExecStart={{ harbor_podman_compose_path.stdout }} -f docker-compose.yml up -d
          ExecStop={{ harbor_podman_compose_path.stdout }} -f docker-compose.yml down
          TimeoutStartSec=600
          Restart=on-failure
          RestartSec=15

          [Install]
          WantedBy=default.target

    - name: systemctl --user daemon-reload + enable harbor.service
      ansible.builtin.command: "{{ item }}"
      become: true
      become_user: "{{ harbor_user }}"
      environment: "{{ rootless_podman_env }}"
      changed_when: true
      loop:
        - systemctl --user daemon-reload
        - systemctl --user enable harbor.service

    - name: 等 Harbor API healthy
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/health"
        status_code: 200
      register: harbor_health_check
      until: harbor_health_check.json.status is defined and harbor_health_check.json.status == "healthy"
      retries: 60
      delay: 5

    # ────────────────────────── proxy-cache：上游 endpoint + project + robot 帳號 + GC 排程 ──────────────────────────

    - name: 列出目前已有的 registry endpoint
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/registries"
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
      register: harbor_existing_registries

    - name: 列出目前已有的 project
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/projects?page_size=100"
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
      register: harbor_existing_projects

    - name: 補上 PROXY_MAP 裡還沒建的 registry endpoint
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/registries"
        method: POST
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          type: "{{ item.type }}"
          url: "{{ item.url }}"
          insecure: false
        status_code: [201]
      loop: "{{ proxy_map }}"
      loop_control:
        label: "{{ item.name }}"
      when: harbor_existing_registries.json | selectattr('name', 'equalto', item.name) | list | length == 0

    - name: 重新查一次 registry endpoint（剛建立的要拿到 id 才能建對應的 project）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/registries"
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
      register: harbor_registries_after_create

    - name: 補上 PROXY_MAP 裡還沒建的 proxy-cache project（quota = harbor_project_quota_bytes）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/projects"
        method: POST
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          project_name: "{{ item.project }}"
          registry_id: "{{ (harbor_registries_after_create.json | selectattr('name', 'equalto', item.name) | first).id }}"
          storage_limit: "{{ harbor_project_quota_bytes }}"
          metadata:
            public: "false"
            auto_scan: "true"
        status_code: [201]
      loop: "{{ proxy_map }}"
      loop_control:
        label: "{{ item.project }}"
      when: harbor_existing_projects.json | selectattr('name', 'equalto', item.project) | list | length == 0

    - name: 系統預設 project quota（之後新建的 project 自動套用同一個 quota）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/configurations"
        method: PUT
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          storage_per_project: "{{ harbor_project_quota_bytes }}"
        status_code: [200]

    - name: 查有沒有既有的 system-level robot 帳號（system robot 不能用 API 改權限，一律刪了重建，帶最新的 PROXY_MAP project 清單）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/robots?page_size=100"
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
      register: harbor_existing_robots

    - name: 刪掉既有的 robot 帳號（如果有）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/robots/{{ (harbor_existing_robots.json | selectattr('name', 'equalto', 'robot$' + robot_name) | first).id }}"
        method: DELETE
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        status_code: [200, 204]
      when: harbor_existing_robots.json | selectattr('name', 'equalto', 'robot$' + robot_name) | list | length > 0

    - name: 組 robot 帳號的權限清單——每個 proxy project 一組固定的 access（pull + 非破壞性的 list/read，不給 delete）
      ansible.builtin.set_fact:
        robot_permissions: "{{ robot_permissions | default([]) + [{
          'kind': 'project',
          'namespace': item.project,
          'access': [
            {'resource': 'repository', 'action': 'pull'},
            {'resource': 'repository', 'action': 'list'},
            {'resource': 'artifact', 'action': 'read'},
            {'resource': 'artifact', 'action': 'list'},
            {'resource': 'tag', 'action': 'list'},
          ],
        }] }}"
      loop: "{{ proxy_map }}"
      loop_control:
        label: "{{ item.project }}"

    - name: 建 robot 拉取帳號（每個 proxy project 的 pull + 非破壞性的 list/read，給 buildah/podman/containerd 拉圖用）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/robots"
        method: POST
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ robot_name }}"
          duration: -1
          level: system
          disable: false
          description: "podman/buildah pull-through cache puller"
          permissions: "{{ robot_permissions }}"
        status_code: [201]
      register: harbor_robot_create

    - name: 確保 {{ harbor_secrets_dir }} 存在（ansible.builtin.copy 不會自動建缺少的上層目錄，下面那個 task 沒有這行會直接失敗）
      ansible.builtin.file:
        path: "{{ harbor_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: 把 robot 帳號的名稱/secret 存進本機檔案（root-only 可讀；跟這個專案 custom/.env 明文存機密的風格一致，見開頭說明）
      ansible.builtin.copy:
        dest: "{{ harbor_secrets_dir }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { name: robot-name, content: "{{ harbor_robot_create.json.name }}" }
        - { name: robot-secret, content: "{{ harbor_robot_create.json.secret }}" }
      no_log: true

    - name: 每週日 04:00 GC 排程（只回收 orphan blob，不刪 untagged manifest——digest-pull 的 base image 常態無 tag，刪 untagged 會每週整批清掉造成週期性 cache miss）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/system/gc/schedule"
        method: PUT
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          parameters:
            delete_untagged: false
          schedule:
            type: Custom
            cron: "0 0 4 * * 0"
        status_code: [200, 404]
      register: harbor_gc_put

    - name: GC 排程第一次建立（PUT 回 404 代表還沒有排程可以更新，改用 POST 新建）
      ansible.builtin.uri:
        url: "{{ harbor_api_base }}/system/gc/schedule"
        method: POST
        url_username: admin
        url_password: "{{ harbor_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          parameters:
            delete_untagged: false
          schedule:
            type: Custom
            cron: "0 0 4 * * 0"
        status_code: [201]
      when: harbor_gc_put.status == 404

    # ────────────────────────── 收尾 ──────────────────────────

    - name: 清掉這支 playbook 自己用過的暫存檔案（harbor.yml 已經用 mv 搬走、不在這裡了；這兩個留著沒用）——不是整個 harbor_staging_dir，proxy_map.json 也放在這個資料夾，但那個檔案是 bootstrap-services 自己後續還要讀的（寫 registries.conf.d mirror 用），不屬於這支 playbook 可以清掉的範圍
      ansible.builtin.file:
        path: "{{ harbor_staging_dir }}/{{ item }}"
        state: absent
      loop:
        - harbor_runtime_vars.yml
        - harbor-install.yml

    - name: 印出結果（journalctl -u bootstrap-harbor 看得到這段）
      ansible.builtin.debug:
        msg:
          - "Harbor 已就緒：https://{{ harbor_hostname }}:{{ nginx_proxy_https_port }}（透過 nginx-proxy 連，不是 harbor_internal_http_port）"
